<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Портфель</title>
<meta name="theme-color" content="#0E6B54">
<meta name="description" content="Учёт инвестиционного портфеля: акции, облигации, фонды, крипта. Данные только на устройстве.">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Портфель">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&family=Unbounded:wght@500;700&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
<noscript><link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&family=Unbounded:wght@500;700&display=swap" rel="stylesheet"></noscript>
<style>
:root{
  --bg:#E9EEEB;--card:#FFFFFF;--ink:#14302A;--muted:#4F625C;--line:#D3DDD8;
  --accent:#0E6B54;--accent-ink:#FFFFFF;--soft:#D7E8E1;--up:#0E6B54;--down:#B4471F;--hi:#E2A11B;
  --s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--s4:#eda100;--s5:#e87ba4;--s6:#008300;--s7:#4a3aa7;--s8:#e34948;
  --grid:#E3EAE6;--toast-bg:#14302A;--toast-ink:#FFFFFF;
  --display:"Unbounded","Onest",system-ui,sans-serif;--body:"Onest",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0D1614;--card:#15211E;--ink:#E3ECE8;--muted:#8DA29B;--line:#26352F;--accent:#3DB892;--accent-ink:#06201A;--soft:#1C332C;
  --up:#3DB892;--down:#F08A5D;--hi:#F0B63A;--grid:#1E2C28;--toast-bg:#2B4740;--toast-ink:#E3ECE8;
  --s1:#3987e5;--s2:#d95926;--s3:#199e70;--s4:#c98500;--s5:#d55181;--s6:#008300;--s7:#9085e9;--s8:#e66767;
  color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#0D1614;--card:#15211E;--ink:#E3ECE8;--muted:#8DA29B;--line:#26352F;--accent:#3DB892;--accent-ink:#06201A;--soft:#1C332C;
  --up:#3DB892;--down:#F08A5D;--hi:#F0B63A;--grid:#1E2C28;--toast-bg:#2B4740;--toast-ink:#E3ECE8;
  --s1:#3987e5;--s2:#d95926;--s3:#199e70;--s4:#c98500;--s5:#d55181;--s6:#008300;--s7:#9085e9;--s8:#e66767;
  color-scheme:dark;}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html{height:100%;overscroll-behavior-y:none}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font:15px/1.45 var(--body);-webkit-tap-highlight-color:transparent;
  padding-top:env(safe-area-inset-top,0px)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.up{color:var(--up)}.down{color:var(--down)}
main{max-width:560px;margin:0 auto;padding:4px 14px calc(160px + env(safe-area-inset-bottom,0px))}
header.top{position:sticky;top:0;z-index:5;background:var(--bg);max-width:560px;margin:0 auto;padding:12px 14px 8px;
  display:flex;align-items:center;justify-content:space-between;gap:8px}
header.top h1{font:700 20px/1.1 var(--display);margin:0;letter-spacing:-.01em}
header.top .acts{display:flex;gap:2px}
#refresh.busy svg{animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.ptr{height:0;overflow:hidden;text-align:center;font-size:13px;color:var(--muted);transition:height .15s}
.stale{color:var(--down)}
.checks{list-style:none;margin:8px 0 0;padding:0;font-size:14px}
.checks li{display:flex;gap:8px;padding:5px 0;border-top:1px solid var(--line)}
.checks li:first-child{border-top:0}
.checks b{flex:none;width:18px}
.iconbtn{width:44px;height:44px;border-radius:12px;border:0;background:transparent;display:grid;place-items:center;color:var(--ink)}
.iconbtn:active{background:var(--soft)}
.iconbtn svg{width:22px;height:22px}
.screen{display:none}.screen.on{display:block}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:12px}
.card h2{font:600 16px/1.3 var(--body);margin:0 0 10px}
.label{font-size:13px;color:var(--muted)}
.hero{font:700 32px/1.1 var(--display);letter-spacing:-.02em;margin:4px 0 6px;word-break:break-word}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px}
/* показатели — плитки, как в «Расходах» */
.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.stats>div{background:var(--bg);border-radius:12px;padding:10px 12px;min-width:0}
.stats .label{font-size:12px;line-height:1.25}
.stats .v{font-weight:600;margin-top:2px}
.demo-note{font-size:13px;background:var(--soft);border-radius:12px;padding:10px 12px;margin-bottom:12px;display:flex;gap:10px;align-items:center;justify-content:space-between}
.demo-note button{border:0;background:transparent;color:var(--accent);font-weight:600;padding:6px 0;min-height:32px}

/* сегменты и чипы */
.seg{display:flex;background:var(--soft);border-radius:12px;padding:3px;gap:2px}
.seg button{flex:1;border:0;background:transparent;border-radius:10px;padding:7px 4px;font-size:13px;font-weight:600;color:var(--muted);min-height:34px}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.chips{display:flex;gap:6px;overflow-x:auto;padding:5px 0;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:7px 12px;font-size:13.5px;min-height:34px;white-space:nowrap}
.chip.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}

/* графики */
.chart{position:relative;margin-top:12px}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.chart{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
.chart svg.has-sel .b:not(.sel){opacity:.45}
.chart .b{cursor:pointer;transition:opacity .15s}
.chart .tip{position:absolute;pointer-events:none;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:6px 9px;font-size:12px;
  box-shadow:0 4px 14px rgba(0,0,0,.12);white-space:nowrap;opacity:0;transition:opacity .1s;z-index:2}
.chart .tip.on{opacity:1}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px;color:var(--muted);margin-top:8px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.legend i.dash{height:2px;border-radius:0;width:14px;background:none;border-top:2px dashed var(--muted);vertical-align:3px}
/* кольцо и легенда: легенда сжимается, а если места мало (узкий экран, крупный шрифт) — уходит под кольцо */
.donut-wrap{display:flex;flex-wrap:wrap;gap:12px 16px;align-items:center;margin-top:12px}
.donut-wrap>#donut{flex:0 0 132px;max-width:132px}
.donut-wrap>.alloc{flex:1 1 11em;min-width:0}
.alloc{list-style:none;margin:0;padding:0;font-size:14.5px}
.alloc li{display:flex;align-items:center;gap:8px;padding:4px 0}
.alloc li i{width:10px;height:10px;border-radius:3px;flex:none}
.alloc li .n{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.alloc li .p{font-weight:600;white-space:nowrap;flex:none}

/* списки */
.list{list-style:none;margin:0;padding:0}
.item{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--line);min-height:56px}
.item:first-child{border-top:0}
.item.tap{cursor:pointer}
.item .badge{width:36px;height:36px;border-radius:10px;background:var(--soft);display:grid;place-items:center;font:700 11px/1 var(--body);flex:none;letter-spacing:.02em;color:var(--ink);overflow:hidden}
.item .main{flex:1;min-width:0}
.item .t{font-weight:600;font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .s{font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .r{text-align:right;flex:none}
.item .r .t{font-weight:600;font-size:15px}
.seg-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;flex-wrap:wrap}
.seg-head h2{margin:2px 0 0}
.seg-sum{text-align:right;margin-left:auto}
.seg-sum .v{font-weight:700;font-size:17px}
.seg-sum .s{font-size:12.5px}
.pos-total .hero{margin:2px 0 4px}
.group-h{font-size:13px;color:var(--muted);font-weight:600;margin:14px 2px 6px}
.empty{text-align:center;color:var(--muted);padding:28px 12px}
.empty .btn{margin-top:12px}
.movers{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.movers h3{font-size:13px;color:var(--muted);font-weight:600;margin:0 0 6px}
.mv{display:flex;justify-content:space-between;font-size:14px;padding:4px 0}

/* формы */
.field{display:block;margin-bottom:12px}
.field>span{display:block;font-size:13px;color:var(--muted);margin-bottom:4px}
.input,select.input{width:100%;min-height:44px;border:1px solid var(--line);background:var(--card);border-radius:12px;padding:10px 12px;font-size:16px}
.input:focus{border-color:var(--accent);outline:none}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn{min-height:46px;border:0;border-radius:14px;padding:0 18px;font-weight:600;background:var(--soft);color:var(--ink)}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.danger{background:transparent;color:var(--down);border:1px solid var(--line)}
.btn.block{width:100%}
.btn-row{display:flex;gap:10px;margin-top:6px}
.btn-row .btn{flex:1}
.err{color:var(--down);font-size:14px;margin:0 0 10px;min-height:0}
.hint{font-size:13px;color:var(--muted);margin:-6px 0 12px}

/* нижняя навигация и FAB */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:10;background:var(--card);border-top:1px solid var(--line);
  padding:4px 6px calc(4px + env(safe-area-inset-bottom,0px))}
nav.tabs .in{max-width:560px;margin:0 auto;display:flex}
nav.tabs button{flex:1;border:0;background:transparent;display:flex;flex-direction:column;align-items:center;gap:2px;padding:9px 0 10px;min-height:56px;font-size:11.5px;color:var(--muted)}
nav.tabs button svg{width:25px;height:25px;stroke-width:1.9}
nav.tabs button.on{color:var(--accent);font-weight:600}
.fab{position:fixed;z-index:11;right:max(18px,calc(50% - 262px));bottom:calc(80px + env(safe-area-inset-bottom,0px));width:62px;height:62px;border-radius:50%;border:0;
  background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;box-shadow:0 6px 18px rgba(14,107,84,.35)}
.fab svg{width:30px;height:30px}

/* шторка */
.sheet-bg{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.35);opacity:0;pointer-events:none;transition:opacity .18s}
.sheet-bg.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;z-index:21;left:0;right:0;bottom:0;max-width:560px;margin:0 auto;background:var(--bg);border-radius:22px 22px 0 0;
  max-height:92vh;overflow-y:auto;padding:8px 16px calc(20px + env(safe-area-inset-bottom,0px));transform:translateY(100%);transition:transform .2s ease}
.sheet.on{transform:none}
.sheet .grab{width:40px;height:4px;border-radius:2px;background:var(--line);margin:4px auto 10px}
.sheet .sh{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.sheet .sh h2{font:700 18px/1.2 var(--display);margin:0}

.toast{position:fixed;z-index:30;left:50%;bottom:calc(144px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);opacity:0;pointer-events:none;
  background:var(--toast-bg);color:var(--toast-ink);border-radius:14px;padding:10px 12px 10px 16px;box-shadow:0 6px 18px rgba(0,0,0,.25);display:flex;gap:12px;align-items:center;max-width:calc(100% - 32px);transition:.18s;font-size:14px}
.toast.on{opacity:1;transform:translate(-50%,0);pointer-events:auto}
.toast button{border:0;background:transparent;color:var(--toast-ink);font-weight:700;text-decoration:underline;min-height:32px}

.bar{height:8px;border-radius:4px;background:var(--soft);position:relative;overflow:hidden}
.bar>b{position:absolute;left:0;top:0;bottom:0;border-radius:4px}
.bar>u{position:absolute;top:-2px;bottom:-2px;width:2px;background:var(--ink)}
.rb{padding:10px 0;border-top:1px solid var(--line)}
.rb:first-child{border-top:0}
.rb .row{margin-bottom:6px}
.rb input{width:72px;min-height:36px;text-align:right;padding:6px 8px}
.sr{position:absolute;left:0;top:0;width:1px;height:1px;margin:-1px;padding:0;border:0;overflow:hidden;clip:rect(0 0 0 0);clip-path:inset(50%);white-space:nowrap}
.more-links .item{cursor:pointer}
.chip,.seg button,.demo-note button,.toast button{position:relative}
.chip::after,.seg button::after,.demo-note button::after,.toast button::after{content:'';position:absolute;inset:-5px 0}
.rb input{min-height:44px}
.tap{cursor:pointer}

/* свайп операции */
.item.sw{display:block;position:relative;padding:0;overflow:hidden}
.sw-c{display:flex;align-items:center;gap:12px;padding:10px 0;min-height:56px;background:var(--card);position:relative;z-index:1;transition:transform .18s ease}
.sw-a{position:absolute;top:0;right:0;bottom:0;display:flex}
.sw-a button{width:92px;border:0;font-weight:600;font-size:13px}
.sw-a .e{background:var(--soft);color:var(--ink)}
.sw-a .d{background:var(--down);color:var(--card)}
#sheet .sw-a{display:none}

/* экран блокировки */
.lock{position:fixed;inset:0;z-index:60;background:var(--bg);display:grid;place-items:center;
  padding:env(safe-area-inset-top,0px) 16px env(safe-area-inset-bottom,0px);overflow-y:auto}
.lock-in{text-align:center;width:100%;max-width:320px;padding:24px 0}
.lock-in:focus{outline:none}
.lock h2{font:700 22px/1.2 var(--display);margin:14px 0 18px}
.lock .logo{width:56px;height:56px;border-radius:16px;margin:0 auto;display:block}
.dots{display:flex;justify-content:center;gap:14px;height:16px;margin-bottom:6px}
.dots span{width:14px;height:14px;border-radius:50%;border:2px solid var(--ink)}
.dots span.f{background:var(--ink)}
.lock .err{min-height:22px;margin:6px 0 10px;text-align:center}
.pad{display:grid;grid-template-columns:repeat(3,72px);gap:14px 22px;justify-content:center}
.pad button{height:72px;width:72px;border-radius:50%;border:0;background:var(--card);box-shadow:inset 0 0 0 1px var(--line);font:500 24px/1 var(--display)}
.pad button:active{background:var(--soft)}
.pad button:disabled{opacity:.4}
.pad .blank{visibility:hidden}
.linkbtn{border:0;background:transparent;color:var(--accent);font-weight:600;min-height:44px;margin-top:14px;padding:0 12px}
.shake{animation:shake .32s}
@keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
body.privacy header.top,body.privacy main,body.privacy nav.tabs,body.privacy .fab,body.privacy .sheet{filter:blur(14px)}
/* строки настроек, как в «Расходах» */
.set-row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.set-row:first-of-type{border-top:0}
.set-row>div{min-width:0}
.set-row small{display:block;color:var(--muted);font-size:12.5px;line-height:1.3}
.set-row .input{width:auto;min-height:40px;padding:6px 10px;font-size:15px}
.btn.small{min-height:40px;padding:0 12px;font-size:14px;border-radius:12px;flex:none}
/* выбор нескольких операций */
.sw.picked .sw-c{background:var(--soft)}
.sw.picked .badge{background:var(--accent)!important;color:var(--accent-ink)!important;font-size:0}
.sw.picked .badge::after{content:'✓';font-size:18px;font-weight:700}
body.selmode #s-ops .sw:not(.picked) .badge{opacity:.55}
.selbar{position:fixed;left:0;right:0;bottom:0;z-index:12;background:var(--card);border-top:1px solid var(--line);
  padding:10px 14px calc(10px + env(safe-area-inset-bottom,0px));display:none}
body.selmode .selbar{display:block}
body.selmode nav.tabs,body.selmode .fab{visibility:hidden}
.selbar .in3{max-width:560px;margin:0 auto;display:flex;align-items:center;gap:8px}
.selbar .info{flex:1;min-width:0;font-size:13.5px;line-height:1.25}
.selbar .info b{display:block;font-size:15px}
.item.sw,.sw-c{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
/* калькулятор в полях сумм */
.calcbar{display:grid;grid-template-columns:repeat(8,1fr);gap:5px;margin-top:6px}
.calcbar button{height:40px;border-radius:10px;border:1px solid var(--line);background:var(--bg);font:500 19px var(--body);color:var(--ink);padding:0;touch-action:manipulation}
.calcbar button.eq{background:var(--soft);border-color:var(--accent);font-weight:700}
.calc-res{min-height:18px;text-align:right;font-size:13px;color:var(--muted);margin-top:3px}
.calc-res.err{color:var(--down)}
/* аналитика */
.an-dates{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px;margin:4px 0 8px}
.an-dates .field{margin-bottom:0;min-width:0}.an-dates .input{width:100%;min-width:0}
.share-row{padding:9px 0;border-top:1px solid var(--line)}
.share-row:first-child{border-top:0}
.share-row .row{gap:8px;font-size:14.5px}
.share-row .row>span:first-child{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.share-row .row>span:last-child{white-space:nowrap;font-weight:600}
.share-row .track{height:6px;background:var(--bg);border-radius:3px;margin-top:6px;overflow:hidden}
.share-row .track i{display:block;height:100%;border-radius:3px}
.cmp{font-size:13px;margin-top:4px}
/* выбранный сектор диаграммы */
.donut-sel{min-height:22px;margin-top:8px;font-size:14px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.donut-sel i{width:10px;height:10px;border-radius:3px}
#donut path{cursor:pointer;transition:opacity .15s}
#donut.has-sel path:not(.sel){opacity:.35}
/* подтверждение поверх экрана блокировки */
body.ask-top .sheet-bg{z-index:70}
body.ask-top .sheet{z-index:71}
.pad .nb{background:none;box-shadow:none;font:600 14px/1.2 var(--body);color:var(--accent)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
@media (max-width:380px){.hero{font-size:26px}.donut-wrap>#donut{flex-basis:110px;max-width:110px}}
</style>
</head>
<body>
<header class="top">
  <h1 id="title">Обзор</h1>
  <div class="acts">
    <button class="iconbtn" id="refresh" aria-label="Обновить котировки" hidden><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 12a8 8 0 1 1-2.34-5.66"/><path d="M20 4v5h-5"/></svg></button>
    <button class="iconbtn" id="eye" aria-label="Скрыть суммы" aria-pressed="false"></button>
  </div>
</header>

<main>
  <div class="ptr" id="ptr" aria-hidden="true">Отпустите, чтобы обновить котировки</div>
  <section class="screen on" id="s-overview"></section>
  <section class="screen" id="s-positions"></section>
  <section class="screen" id="s-ops"></section>
  <section class="screen" id="s-analytics"></section>
  <section class="screen" id="s-more"></section>
</main>

<button class="fab" id="fab" aria-label="Добавить операцию">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>

<script>
'use strict';
const C = window.PortfolioCore;
const QT = window.PortfolioQuotes;
// приложение запущено как Android-приложение (Capacitor), а не в браузере
const NATIVE = !!(window.Capacitor && window.Capacitor.isNativePlatform && window.Capacitor.isNativePlatform());
const nativePlugin = name => window.Capacitor.Plugins[name] || window.Capacitor.registerPlugin(name);
const IS_IOS = /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
// версия: в APK её подставляет сборка (scripts/build-www.mjs)
const APP_VERSION = '1.2.0';
const RELEASE_URL = 'https://github.com/yeakhmetov/Portfolio/releases/download/android-latest/portfolio.apk';
const lsGet = k => { try { return localStorage.getItem(k); } catch (e) { return null; } };

/* ================= справочники ================= */

const CLASS_LABELS = { stock: 'Акции', bond: 'Облигации', etf: 'ETF', fund: 'ПИФ', crypto: 'Криптовалюта', deposit: 'Депозит', currency: 'Валюта', other: 'Другое' };
// группы для структуры портфеля — фиксированный порядок = фиксированный цвет
const GROUPS = [
  { key: 'stock', label: 'Акции', classes: ['stock'] },
  { key: 'bond', label: 'Облигации', classes: ['bond'] },
  { key: 'fund', label: 'Фонды', classes: ['etf', 'fund'] },
  { key: 'crypto', label: 'Криптовалюта', classes: ['crypto'] },
  { key: 'deposit', label: 'Депозиты', classes: ['deposit'] },
  { key: 'cash', label: 'Деньги', classes: ['currency'] },
  { key: 'other', label: 'Другое', classes: ['other'] }
];
const groupOf = cls => (GROUPS.find(g => g.classes.includes(cls)) || GROUPS[6]).key;
const groupLabel = k => (GROUPS.find(g => g.key === k) || { label: k }).label;
const TYPE_LABELS = { buy: 'Покупка', sell: 'Продажа', dividend: 'Дивиденд', coupon: 'Купон', deposit: 'Пополнение', withdraw: 'Вывод',
  fee: 'Комиссия', tax: 'Налог', split: 'Сплит', transfer: 'Перевод' };
const ACCOUNT_TYPES = { broker: 'Брокерский счёт', bank: 'Банк', crypto: 'Криптокошелёк', cash: 'Наличные' };
const EXCHANGES = ['KASE', 'AIX', 'MOEX', 'NYSE', 'NASDAQ', 'LSE', 'CRYPTO', 'OTC'];
const CURRENCIES = ['KZT', 'USD', 'EUR', 'RUB', 'GBP', 'CNY'];
const SERIES = ['var(--s1)', 'var(--s2)', 'var(--s3)', 'var(--s4)', 'var(--s5)', 'var(--s6)', 'var(--s7)', 'var(--s8)'];

/* ================= состояние ================= */
// Хранилище подключается на шаге 3 (IndexedDB). Пока данные живут в памяти.

let S = null;
const UI = { an: { period: 'year', from: '', to: '', account: 'all', metric: 'payouts', limit: 4 }, tab: 'overview', period: '1y', alloc: 'class', posAccount: 'all', posClass: 'all', posSort: 'value', opsQuery: '', opsType: 'all' };

function emptyState() {
  return { accounts: [], assets: [], txs: [], prices: {}, fx: [], targets: { stock: 40, bond: 25, fund: 20, crypto: 5, cash: 10 },
    settings: { baseCurrency: 'KZT', theme: 'system', method: 'fifo', hideAmounts: false,
      autoQuotes: true, quoteRefreshMinutes: 15, proxyUrl: '', proxyToken: '', twelveDataKey: '' }, demo: false, seq: 0 };
}

function initialState() {
  return Object.assign(emptyState(), { accounts: [{ id: C.uid(), name: 'Брокерский счёт', broker: '', type: 'broker', currency: 'KZT', archived: false, trackCash: true }] });
}
// восстановление недостающих полей (данные из старой версии или из резервной копии)
function hydrate(d) {
  const e = emptyState();
  return {
    accounts: d.accounts || [], assets: d.assets || [], txs: d.txs || [], prices: d.prices || {}, fx: d.fx || [],
    targets: d.targets || e.targets, settings: Object.assign(e.settings, d.settings || {}),
    demo: !!d.demo, seq: d.seq || (d.txs || []).reduce((m, t) => Math.max(m, t.seq || 0), 0)
  };
}

/* ================= хранилище ================= */
// IndexedDB — основное хранилище; localStorage — запасное и для настроек (тема до загрузки).

const Store = (() => {
  const DB = 'portfolio', KEYS = ['accounts', 'assets', 'txs', 'prices', 'fx', 'meta'];
  let db = null, mode = 'memory';
  const req = r => new Promise((res, rej) => { r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); });
  function openDb() {
    return new Promise((res, rej) => {
      try {
        const r = indexedDB.open(DB, 1);
        r.onupgradeneeded = () => r.result.createObjectStore('kv');
        r.onsuccess = () => res(r.result);
        r.onerror = () => rej(r.error);
        r.onblocked = () => rej(new Error('blocked'));
        setTimeout(() => rej(new Error('timeout')), 4000);
      } catch (e) { rej(e); }
    });
  }
  function split(st) {
    return { accounts: st.accounts, assets: st.assets, txs: st.txs, prices: st.prices, fx: st.fx,
      meta: { targets: st.targets, settings: st.settings, demo: st.demo, seq: st.seq, version: 1 } };
  }
  function join(parts) {
    if (!parts.meta) return null;
    return hydrate(Object.assign({ accounts: parts.accounts, assets: parts.assets, txs: parts.txs, prices: parts.prices, fx: parts.fx }, parts.meta));
  }
  async function init() {
    try { db = await openDb(); mode = 'idb'; }
    catch (e) {
      try { localStorage.setItem('portfolio:test', '1'); localStorage.removeItem('portfolio:test'); mode = 'local'; }
      catch (e2) { mode = 'memory'; }
    }
    try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch (e) { /* не критично */ }
    return mode;
  }
  async function load() {
    try {
      if (mode === 'idb') {
        const tx = db.transaction('kv', 'readonly'), os = tx.objectStore('kv');
        const vals = await Promise.all(KEYS.map(k => req(os.get(k))));
        const parts = {}; KEYS.forEach((k, i) => { parts[k] = vals[i]; });
        return join(parts);
      }
      if (mode === 'local') {
        const parts = {}; KEYS.forEach(k => { const v = localStorage.getItem('portfolio:' + k); parts[k] = v ? JSON.parse(v) : undefined; });
        return join(parts);
      }
    } catch (e) { console.error(e); throw e; }
    return null;
  }
  function saveSettings(st) { try { localStorage.setItem('portfolio:settings', JSON.stringify({ theme: st.settings.theme })); } catch (e) { /* нет localStorage */ } }
  let chain = Promise.resolve();
  function save(st) {
    saveSettings(st);
    const parts = split(st);
    chain = chain.then(async () => {
      if (mode === 'idb') {
        await new Promise((res, rej) => {
          const tx = db.transaction('kv', 'readwrite'), os = tx.objectStore('kv');
          KEYS.forEach(k => os.put(parts[k], k));
          tx.oncomplete = res; tx.onerror = () => rej(tx.error); tx.onabort = () => rej(tx.error);
        });
      } else if (mode === 'local') {
        KEYS.forEach(k => localStorage.setItem('portfolio:' + k, JSON.stringify(parts[k])));
      }
    }).catch(e => { console.error(e); toast('Не удалось сохранить данные: ' + (e && e.name === 'QuotaExceededError' ? 'нет места' : 'ошибка хранилища')); });
    return chain;
  }
  return { init, load, save, get mode() { return mode; } };
})();

/* ================= демо-данные ================= */

function addDays(d, n) {
  const t = new Date(Date.UTC(+d.slice(0, 4), +d.slice(5, 7) - 1, +d.slice(8, 10)) + n * 86400000);
  return t.toISOString().slice(0, 10);
}
function mulberry32(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

function makeDemo() {
  const st = emptyState();
  st.demo = true;
  const rnd = mulberry32(20260927);
  const end = C.today();
  const start = addDays(end, -560);
  const acc = (id, name, broker, currency, type, trackCash) => ({ id, name, broker, currency, type, archived: false, trackCash });
  st.accounts = [
    acc('a1', 'Freedom Broker', 'Freedom Finance', 'KZT', 'broker', true),
    acc('a2', 'Halyk Invest', 'Halyk Finance', 'KZT', 'broker', true),
    acc('a3', 'Криптокошелёк', '', 'USD', 'crypto', false)
  ];
  const as = (id, ticker, name, cls, currency, exchange, p0, drift, vol, extra) =>
    Object.assign({ id, ticker, name, class: cls, currency, exchange, _p0: p0, _drift: drift, _vol: vol }, extra || {});
  const assets = [
    as('KCEL', 'KCEL', 'Kcell', 'stock', 'KZT', 'KASE', 1900, 0.10, 0.018, { sector: 'Телеком' }),
    as('HSBK', 'HSBK', 'Халык Банк', 'stock', 'KZT', 'KASE', 190, 0.22, 0.014, { sector: 'Финансы' }),
    as('KZTO', 'KZTO', 'КазТрансОйл', 'stock', 'KZT', 'KASE', 880, -0.04, 0.012, { sector: 'Энергетика' }),
    as('KEGC', 'KEGC', 'KEGOC', 'stock', 'KZT', 'KASE', 1530, 0.02, 0.008, { sector: 'Энергетика' }),
    as('KAP', 'KAP', 'Казатомпром', 'stock', 'USD', 'AIX', 36, 0.12, 0.02, { sector: 'Сырьё' }),
    as('AAPL', 'AAPL', 'Apple', 'stock', 'USD', 'KASE', 185, 0.14, 0.015, { sector: 'Технологии' }),
    as('SPY', 'SPY', 'SPDR S&P 500 ETF', 'etf', 'USD', 'NYSE', 480, 0.12, 0.009),
    as('MUM120', 'MUM120_0017', 'МЕУКАМ-120 Минфин РК', 'bond', 'KZT', 'KASE', 94, 0.02, 0.002, { faceValue: 1000, maturityDate: '2031-06-15' }),
    as('BTC', 'BTC', 'Bitcoin', 'crypto', 'USD', 'CRYPTO', 60000, 0.35, 0.03)
  ];
  // цены: случайное блуждание по дням
  const days = C.daysBetween(start, end);
  assets.forEach(a => {
    let p = a._p0; const list = [];
    for (let i = 0; i <= days; i++) {
      const d = addDays(start, i);
      const dow = new Date(d).getUTCDay();
      if (a.class !== 'crypto' && (dow === 0 || dow === 6) && i !== days) continue;
      p = p * Math.exp(a._drift / 365 + a._vol * (rnd() * 2 - 1) * 1.2);
      const dec = a.class === 'bond' ? 2 : p < 100 ? 2 : p < 10000 ? 1 : 0;
      list.push({ date: d, price: +p.toFixed(dec), source: 'demo' });
    }
    st.prices[a.id] = list;
  });
  let r = 455;
  for (let i = 0; i <= days; i += 1) {
    r = r * Math.exp(0.08 / 365 + 0.004 * (rnd() * 2 - 1));
    st.fx.push({ date: addDays(start, i), base: 'USD', quote: 'KZT', rate: +r.toFixed(2) });
  }
  st.fx.push({ date: start, base: 'EUR', quote: 'USD', rate: 1.08 });
  st.fx.push({ date: start, base: 'USD', quote: 'RUB', rate: 92 });
  st.assets = assets.map(a => { const c = Object.assign({}, a); delete c._p0; delete c._drift; delete c._vol; return c; });

  const priceOn = (id, d) => { const l = st.prices[id]; let f = l[0]; for (const x of l) { if (x.date <= d) f = x; else break; } return f.price; };
  const tx = t => { t.id = C.uid(); t.seq = ++st.seq; t.fee = t.fee || 0; st.txs.push(t); };
  const assetById = id => st.assets.find(a => a.id === id);
  const buy = (acc, id, day, qty, type) => {
    const a = assetById(id), d = addDays(start, day), price = priceOn(id, d), q = C.parseQty(String(qty));
    const amount = C.calcAmount(q, price, a.currency, a);
    tx({ accountId: acc, assetId: id, type: type || 'buy', date: d, quantity: q, price, amount, fee: Math.round(amount * 0.001), currency: a.currency });
  };
  const K = s => C.parseMoney(s, 'KZT'), U = s => C.parseMoney(s, 'USD');
  tx({ accountId: 'a1', type: 'deposit', date: addDays(start, 1), amount: K('3000000'), currency: 'KZT' });
  tx({ accountId: 'a1', type: 'deposit', date: addDays(start, 2), amount: U('4000'), currency: 'USD', note: 'Покупка долларов' });
  tx({ accountId: 'a2', type: 'deposit', date: addDays(start, 3), amount: K('1500000'), currency: 'KZT' });
  buy('a1', 'KCEL', 5, 300); buy('a1', 'HSBK', 6, 2000); buy('a1', 'KZTO', 8, 400);
  buy('a1', 'AAPL', 9, 6); buy('a1', 'SPY', 10, 3); buy('a1', 'KAP', 12, 20);
  buy('a2', 'MUM120', 7, 800); buy('a2', 'KEGC', 14, 250);
  buy('a3', 'BTC', 20, '0.025');
  for (let m = 1; m <= 17; m++) {
    const day = m * 30 + 4;
    if (day > days - 2) break;
    tx({ accountId: 'a1', type: 'deposit', date: addDays(start, day), amount: K('150000'), currency: 'KZT' });
    const pick = ['HSBK', 'KCEL', 'KEGC', 'HSBK', 'KZTO'][m % 5];
    const p = priceOn(pick, addDays(start, day + 1));
    buy('a1', pick, day + 1, Math.max(1, Math.floor(140000 / p)));
  }
  buy('a3', 'BTC', 200, '0.01');
  buy('a1', 'KCEL', 330, 150, 'sell');
  // дивиденды и купоны
  const pay = (acc, id, day, perShare, taxRate, type) => {
    const a = assetById(id), d = addDays(start, day);
    if (day > days) return;
    const st2 = C.computePortfolio(st.txs.filter(t => t.date <= d));
    const pos = st2.positions[acc + '|' + id];
    if (!pos || !pos.qty) return;
    const amount = C.calcAmount(pos.qty, perShare, a.currency);
    tx({ accountId: acc, assetId: id, type: type || 'dividend', date: d, amount, tax: Math.round(amount * taxRate), currency: a.currency });
  };
  [140, 505].forEach(d => pay('a1', 'HSBK', d, 38, 0.05));
  [160, 525].forEach(d => pay('a1', 'KZTO', d, 60, 0.05));
  [100, 280, 465].forEach(d => pay('a2', 'KEGC', d, 70, 0.05));
  [60, 150, 240, 330, 420, 510].forEach(d => pay('a1', 'AAPL', d, 0.25, 0.10));
  [90, 180, 270, 360, 450, 540].forEach(d => pay('a1', 'SPY', d, 1.7, 0.10));
  [120, 300, 485].forEach(d => pay('a1', 'KAP', d, 1.2, 0.10));
  [175, 358, 540].forEach(d => pay('a2', 'MUM120', d, 48, 0, 'coupon'));
  return st;
}

/* ================= производные данные ================= */

const byId = list => Object.fromEntries(list.map(x => [x.id, x]));
function priceAt(assetId, d) {
  const l = S.prices[assetId];
  if (!l || !l.length) return null;
  let lo = 0, hi = l.length - 1, ans = -1;
  while (lo <= hi) { const m = (lo + hi) >> 1; if (l[m].date <= d) { ans = m; lo = m + 1; } else hi = m - 1; }
  return ans < 0 ? null : l[ans];
}
function pricesAt(d) {
  const m = {};
  S.assets.forEach(a => { const p = priceAt(a.id, d); if (p) m[a.id] = p; });
  return m;
}

let D = null; // кэш расчётов, сбрасывается при изменениях
function derive() {
  if (D) return D;
  const base = S.settings.baseCurrency, date = C.today();
  const fx = C.makeFx(S.fx);
  const assets = byId(S.assets), accounts = byId(S.accounts);
  const state = C.computePortfolio(S.txs, { method: S.settings.method });
  const ctx = { assets, accounts, fx, base, date, prices: pricesAt(date) };
  const sum = C.summarize(state, ctx);
  const yd = addDays(date, -1);
  // изменение за день: сравниваем с ценой предыдущих торгов (не старше 4 дней — с учётом выходных).
  // Если такой цены нет (бумага куплена сегодня или до этого была только цена сделки месяцы назад),
  // изменение по бумаге нулевое
  const prevPrices = Object.assign({}, ctx.prices);
  const prevAll = pricesAt(yd), oldest = addDays(date, -4);
  Object.keys(prevAll).forEach(id => { if (prevAll[id].date >= oldest) prevPrices[id] = prevAll[id]; });
  const sumY = C.summarize(state, Object.assign({}, ctx, { prices: prevPrices, date: yd }));
  const flows = C.investorFlows(S.txs, sum, { fx, base, date, cash: state.cash, accounts });
  const flowsNoEnd = C.investorFlows(S.txs, { rows: [] }, { fx, base, date, cash: {}, accounts });
  const contributed = -flowsNoEnd.reduce((s, f) => s + f.amount, 0);
  const cashRows = [];
  Object.keys(state.cash).forEach(accId => {
    const acc = accounts[accId];
    if (!acc || acc.archived || acc.trackCash === false || !state.funded[accId]) return;
    Object.keys(state.cash[accId]).forEach(cur => {
      const v = state.cash[accId][cur];
      if (v) cashRows.push({ accountId: accId, currency: cur, minor: v, base: fx.convert(v, cur, base, date) || 0 });
    });
  });
  D = { base, date, fx, assets, accounts, state, sum, sumY, ctx, flows, flowsNoEnd, contributed, xirr: C.xirr(flows), cashRows };
  return D;
}
function invalidate() { D = null; }

/* ================= форматирование ================= */

const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
function money(minor, cur, opts) {
  if (S.settings.hideAmounts) return '•••• ' + (C.formatMoney(0, cur).split(' ').pop());
  return C.formatMoney(minor, cur, opts);
}
const pct = (x, sign) => C.formatPercent(x, { sign });
const cls = x => x > 0 ? 'up' : x < 0 ? 'down' : 'muted';
const arrow = x => x > 0 ? '▲ ' : x < 0 ? '▼ ' : '';
const MONTHS = ['янв', 'фев', 'мар', 'апр', 'мая', 'июн', 'июл', 'авг', 'сен', 'окт', 'ноя', 'дек'];
const MONTHS_N = ['Январь', 'Февраль', 'Март', 'Апрель', 'Май', 'Июнь', 'Июль', 'Август', 'Сентябрь', 'Октябрь', 'Ноябрь', 'Декабрь'];
function fdate(d, withYear) {
  const y = d.slice(0, 4), m = +d.slice(5, 7), day = +d.slice(8, 10);
  return day + ' ' + MONTHS[m - 1] + (withYear || y !== C.today().slice(0, 4) ? ' ' + y : '');
}
function fprice(p, cur, asset) {
  if (asset && asset.class === 'bond' && asset.faceValue) return String(p).replace('.', ',') + ' %';
  if (S.settings.hideAmounts) return '••••';
  const d = p >= 1000 ? 0 : p >= 1 ? 2 : 6;
  return new Intl.NumberFormat('ru-RU', { maximumFractionDigits: d }).format(p) + ' ' + (C.formatMoney(0, cur).split(' ').pop());
}
const tickerBadge = a => { const t = (a && a.ticker || '?').replace(/_.*/, ''); return t.length > 4 ? `<span style="font-size:9.5px">${esc(t.slice(0, 6))}</span>` : esc(t); };

// линейный график с перекрестием и подсказкой. series: [{name, color, dash, values:[number]}], labels: [string]
function lineChart(el, labels, series, fmt) {
  const W = 520, H = 190, P = { l: 4, r: 4, t: 10, b: 22 };
  const all = series.flatMap(s => s.values).filter(v => v != null);
  if (!all.length || labels.length < 2) { el.innerHTML = '<div class="empty">Недостаточно данных для графика</div>'; return; }
  let min = Math.min(...all), max = Math.max(...all);
  if (min === max) { min -= 1; max += 1; }
  const pad = (max - min) * 0.08; min -= pad; max += pad;
  const x = i => P.l + i * (W - P.l - P.r) / (labels.length - 1);
  const y = v => P.t + (max - v) * (H - P.t - P.b) / (max - min);
  const path = vals => vals.map((v, i) => (i ? 'L' : 'M') + x(i).toFixed(1) + ' ' + y(v).toFixed(1)).join('');
  const grid = [0.25, 0.5, 0.75].map(f => `<line x1="0" x2="${W}" y1="${(P.t + f * (H - P.t - P.b)).toFixed(1)}" y2="${(P.t + f * (H - P.t - P.b)).toFixed(1)}" stroke="var(--grid)" stroke-width="1"/>`).join('');
  const ticks = [0, Math.floor((labels.length - 1) / 2), labels.length - 1].map((i, k) =>
    `<text x="${x(i).toFixed(1)}" y="${H - 5}" font-size="11" fill="var(--muted)" text-anchor="${k === 0 ? 'start' : k === 2 ? 'end' : 'middle'}">${esc(labels[i])}</text>`).join('');
  const lines = series.map(s => `<path d="${path(s.values)}" fill="none" stroke="${s.color}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" ${s.dash ? 'stroke-dasharray="4 4"' : ''}/>`).join('');
  el.innerHTML = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(series.map(s => s.name).join(', '))}">
    ${grid}${lines}${ticks}
    <line class="cx" y1="${P.t}" y2="${H - P.b}" stroke="var(--muted)" stroke-width="1" opacity="0"/>
    ${series.map((s, i) => `<circle class="dot" data-i="${i}" r="4" fill="${s.color}" stroke="var(--card)" stroke-width="2" opacity="0"/>`).join('')}
    <rect x="0" y="0" width="${W}" height="${H}" fill="transparent" class="hit"/>
  </svg><div class="tip"></div>`;
  const svg = el.querySelector('svg'), tip = el.querySelector('.tip'), cx = svg.querySelector('.cx'), dots = svg.querySelectorAll('.dot');
  function show(ev) {
    const r = svg.getBoundingClientRect();
    const px = (ev.clientX - r.left) / r.width * W;
    const i = Math.max(0, Math.min(labels.length - 1, Math.round((px - P.l) / (W - P.l - P.r) * (labels.length - 1))));
    cx.setAttribute('x1', x(i)); cx.setAttribute('x2', x(i)); cx.setAttribute('opacity', 1);
    series.forEach((s, k) => { dots[k].setAttribute('cx', x(i)); dots[k].setAttribute('cy', y(s.values[i])); dots[k].setAttribute('opacity', 1); });
    tip.innerHTML = `<div class="muted">${esc(labels[i])}</div>` + series.map(s => `<div><i style="display:inline-block;width:8px;height:8px;border-radius:2px;background:${s.color};margin-right:6px"></i>${esc(s.name)}: <b class="num">${fmt(s.values[i])}</b></div>`).join('');
    tip.classList.add('on');
    const tx = x(i) / W * r.width;
    tip.style.left = Math.min(Math.max(0, tx - tip.offsetWidth / 2), r.width - tip.offsetWidth) + 'px';
    tip.style.top = '-8px';
  }
  function hide() { tip.classList.remove('on'); cx.setAttribute('opacity', 0); dots.forEach(d => d.setAttribute('opacity', 0)); }
  svg.addEventListener('pointermove', show);
  svg.addEventListener('pointerdown', show);
  svg.addEventListener('pointerleave', hide);
}

// кольцевая диаграмма. slices: [{label, value, color}]
function donut(el, slices, centerLabel) {
  const total = slices.reduce((s, x) => s + Math.max(0, x.value), 0);
  const R = 60, r = 42, C0 = 66;
  let a0 = -Math.PI / 2;
  const arcs = slices.filter(s => s.value > 0).map(s => {
    const frac = s.value / total, a1 = a0 + frac * Math.PI * 2;
    const large = a1 - a0 > Math.PI ? 1 : 0;
    const p = (ang, rad) => [(C0 + rad * Math.cos(ang)).toFixed(2), (C0 + rad * Math.sin(ang)).toFixed(2)];
    let d;
    if (frac >= 0.9999) d = `M${C0} ${C0 - R}A${R} ${R} 0 1 1 ${C0 - 0.01} ${C0 - R}L${C0 - 0.01} ${C0 - r}A${r} ${r} 0 1 0 ${C0} ${C0 - r}Z`;
    else { const [x1, y1] = p(a0, R), [x2, y2] = p(a1, R), [x3, y3] = p(a1, r), [x4, y4] = p(a0, r);
      d = `M${x1} ${y1}A${R} ${R} 0 ${large} 1 ${x2} ${y2}L${x3} ${y3}A${r} ${r} 0 ${large} 0 ${x4} ${y4}Z`; }
    a0 = a1;
    return `<path d="${d}" fill="${s.color}" stroke="var(--card)" stroke-width="2" data-k="${esc(s.key)}" class="${s.key === UI.allocSel ? 'sel' : ''}"><title>${esc(s.label)}: ${pct(frac)}</title></path>`;
  }).join('');
  el.innerHTML = `<svg viewBox="0 0 132 132" role="img" aria-label="Структура портфеля">${arcs || `<circle cx="${C0}" cy="${C0}" r="${(R + r) / 2}" fill="none" stroke="var(--soft)" stroke-width="${R - r}"/>`}
    <text x="${C0}" y="${C0 + 4}" text-anchor="middle" font-size="12" font-weight="600" fill="var(--muted)">${esc(centerLabel || '')}</text></svg>`;
}

// столбчатый график (одна серия)
// столбцы с несколькими рядами: положительные значения складываются вверх, отрицательные — вниз от нуля.
// series: [{ name, color, values, colorOf? }] — colorOf(v) задаёт цвет столбца по знаку
function barChart2(el, labels, series, fmt) {
  const W = 520, H = 180, P = { t: 12, b: 24 };
  const n = labels.length;
  const pos = labels.map((_, i) => series.reduce((s, r) => s + Math.max(0, r.values[i] || 0), 0));
  const neg = labels.map((_, i) => series.reduce((s, r) => s + Math.min(0, r.values[i] || 0), 0));
  const max = Math.max(1, ...pos), min = Math.min(0, ...neg);
  const span = max - min || 1, plotH = H - P.t - P.b;
  const y = v => P.t + (max - v) / span * plotH;
  const gap = n > 24 ? 2 : 6, bw = Math.max(2, (W - gap * (n - 1)) / n);
  const every = Math.ceil(n / 12);
  let bars = '';
  for (let i = 0; i < n; i++) {
    const x = i * (bw + gap);
    let up = 0, down = 0, segs = '';
    series.forEach((r, k) => {
      const v = r.values[i] || 0;
      if (!v) return;
      const color = r.colorOf ? r.colorOf(v) : r.color;
      const a = v > 0 ? up : down, b = a + v;
      if (v > 0) up = b; else down = b;
      const y1 = Math.min(y(a), y(b)), h = Math.max(1, Math.abs(y(a) - y(b)) - (k ? 2 : 0));
      // скругление только на конце столбца
      const last = v > 0 ? !series.slice(k + 1).some(o => (o.values[i] || 0) > 0) : !series.slice(k + 1).some(o => (o.values[i] || 0) < 0);
      const rr = last ? Math.min(4, bw / 2, h) : 0;
      if (v > 0) segs += `<path d="M${x.toFixed(1)} ${(y1 + h).toFixed(1)}V${(y1 + rr).toFixed(1)}q0 -${rr} ${rr} -${rr}h${(bw - 2 * rr).toFixed(1)}q${rr} 0 ${rr} ${rr}V${(y1 + h).toFixed(1)}Z" fill="${color}"/>`;
      else segs += `<path d="M${x.toFixed(1)} ${y1.toFixed(1)}V${(y1 + h - rr).toFixed(1)}q0 ${rr} ${rr} ${rr}h${(bw - 2 * rr).toFixed(1)}q${rr} 0 ${rr} -${rr}V${y1.toFixed(1)}Z" fill="${color}"/>`;
    });
    bars += `<g class="b" data-i="${i}"><rect x="${x.toFixed(1)}" y="${P.t}" width="${bw.toFixed(1)}" height="${plotH}" fill="transparent"/>${segs}
      ${i % every === 0 ? `<text x="${(x + bw / 2).toFixed(1)}" y="${H - 6}" font-size="10.5" fill="var(--muted)" text-anchor="middle">${esc(labels[i])}</text>` : ''}</g>`;
  }
  el.innerHTML = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(series.map(r => r.name).join(', '))}">
    <line x1="0" x2="${W}" y1="${y(0).toFixed(1)}" y2="${y(0).toFixed(1)}" stroke="var(--line)"/>${bars}</svg><div class="tip"></div>`;
  const svg = el.querySelector('svg'), tip = el.querySelector('.tip');
  // нажатие закрепляет подсказку у столбца до нажатия на другой; мышью — ещё и подсказка при наведении
  let sel = -1;
  const show = i => {
    if (i < 0) { tip.classList.remove('on'); return; }
    const r = svg.getBoundingClientRect();
    tip.innerHTML = `<div class="muted">${esc(labels[i])}</div>` + series.map(s2 => `<div>${series.length > 1 ? `<i style="display:inline-block;width:8px;height:8px;border-radius:2px;background:${s2.color};margin-right:6px"></i>${esc(s2.name)}: ` : ''}<b class="num">${fmt(s2.values[i] || 0)}</b></div>`).join('');
    tip.classList.add('on');
    const cxp = (i * (bw + gap) + bw / 2) / W * r.width;
    tip.style.left = Math.min(Math.max(0, cxp - tip.offsetWidth / 2), r.width - tip.offsetWidth) + 'px';
    tip.style.top = '-8px';
  };
  svg.addEventListener('contextmenu', e => e.preventDefault());
  svg.querySelectorAll('.b').forEach(g => {
    const i = +g.dataset.i;
    g.addEventListener('click', () => {
      sel = i;
      svg.classList.add('has-sel');
      svg.querySelectorAll('.b.sel').forEach(x => x.classList.remove('sel'));
      g.classList.add('sel');
      show(i);
    });
    g.addEventListener('pointerenter', e => { if (e.pointerType === 'mouse') show(i); });
    g.addEventListener('pointerleave', e => { if (e.pointerType === 'mouse') show(sel); });
  });
}

const PERIODS = [['1w', '1Н', 7], ['1m', '1М', 30], ['3m', '3М', 91], ['1y', '1Г', 365], ['all', 'Всё', 0]];

function historySeries(days) {
  const d = derive();
  const first = S.txs.reduce((m, t) => t.date < m ? t.date : m, d.date);
  let start = days ? addDays(d.date, -days) : first;
  if (start < first) start = first;
  const span = C.daysBetween(start, d.date);
  const n = Math.min(span + 1, 80);
  const dates = [];
  for (let i = 0; i < n; i++) dates.push(addDays(start, Math.round(i * span / Math.max(1, n - 1))));
  const sorted = S.txs.slice();
  const value = [], invested = [];
  dates.forEach(day => {
    const txs = sorted.filter(t => t.date <= day);
    const st = C.computePortfolio(txs, { method: S.settings.method });
    const sm = C.summarize(st, Object.assign({}, d.ctx, { prices: pricesAt(day), date: day }));
    value.push(sm.total);
    invested.push(-d.flowsNoEnd.filter(f => f.date <= day).reduce((s, f) => s + f.amount, 0));
  });
  return { labels: dates.map(x => fdate(x)), value, invested };
}

function allocation(mode) {
  const d = derive(), rows = d.sum.rows;
  const m = new Map();
  const add = (k, label, v) => { const e = m.get(k) || { key: k, label, value: 0 }; e.value += v; m.set(k, e); };
  if (mode === 'class') {
    GROUPS.forEach(g => m.set(g.key, { key: g.key, label: g.label, value: 0 }));
    rows.forEach(r => add(groupOf(r.asset.class), '', r.valueBase));
    d.cashRows.forEach(c => add('cash', '', c.base));
  } else if (mode === 'currency') {
    ['KZT', 'USD', 'EUR', 'RUB'].forEach(c => m.set(c, { key: c, label: c, value: 0 }));
    rows.forEach(r => add(r.currency, r.currency, r.valueBase));
    d.cashRows.forEach(c => add(c.currency, c.currency, c.base));
  } else if (mode === 'account') {
    S.accounts.forEach(a => m.set(a.id, { key: a.id, label: a.name, value: 0 }));
    rows.forEach(r => add(r.accountId, r.accountId, r.valueBase));
    d.cashRows.forEach(c => add(c.accountId, c.accountId, c.base));
  } else {
    rows.forEach(r => add(r.asset.sector || 'Без сектора', r.asset.sector || 'Без сектора', r.valueBase));
  }
  // цвет закреплён за сущностью по её позиции в фиксированном списке
  let list = Array.from(m.values()).map((e, i) => Object.assign(e, { color: SERIES[Math.min(i, 7)] }));
  list = list.filter(e => e.value > 0);
  if (list.length > 8) {
    const rest = list.slice(7).reduce((s, e) => s + e.value, 0);
    list = list.slice(0, 7).concat([{ key: 'other', label: 'Прочее', value: rest, color: SERIES[7] }]);
  }
  return list;
}

function notices() {
  let h = '';
  const cfg = Quotes.configIssues();
  if (cfg) h += `<div class="demo-note"><span>${cfg}</span><button data-act="goto-quotes">Настроить</button></div>`;
  if (Store.mode === 'memory') h += `<div class="demo-note" style="background:var(--card);border:1px solid var(--down)"><span><b class="down">Хранилище недоступно.</b> Браузер не даёт сохранять данные (например, в приватном режиме) — после закрытия всё пропадёт. Сохраните копию в разделе «Ещё».</span></div>`;
  const lb = S.settings.lastBackupAt;
  const days = lb ? Math.floor((Date.now() - new Date(lb)) / 86400000) : null;
  if (S.txs.length && !S.demo && (days == null || days > 30))
    h += `<div class="demo-note"><span>${days == null ? 'Резервной копии ещё нет.' : 'Последняя копия — ' + days + ' ' + plural(days, 'день', 'дня', 'дней') + ' назад.'} Данные хранятся только на этом устройстве.</span><button data-act="export-json">Сохранить копию</button></div>`;
  return h;
}

function renderOverview() {
  const el = document.getElementById('s-overview');
  if (!S.txs.length) {
    el.innerHTML = notices() + `<div class="card empty"><h2>Портфель пуст</h2><p>Добавьте первую покупку — стоимость и доходность посчитаются автоматически.</p>
      <div class="btn-row"><button class="btn primary" data-act="add">Добавить покупку</button><button class="btn" data-act="demo">Демо-данные</button></div></div>`;
    return;
  }
  const d = derive(), s = d.sum, base = d.base;
  const dayChange = s.total - d.sumY.total;
  const dayPct = d.sumY.total ? dayChange / d.sumY.total : 0;
  const pnl = s.total - d.contributed;
  const pnlPct = d.contributed ? pnl / d.contributed : 0;
  const per = PERIODS.find(p => p[0] === UI.period);
  d.hist = d.hist || {};
  const hist = d.hist[UI.period] || (d.hist[UI.period] = historySeries(per[2]));
  const alloc = allocation(UI.alloc);
  const allocTotal = alloc.reduce((a, b) => a + b.value, 0);
  const movers = s.rows.filter(r => r.hasPrice).map(r => {
    const py = priceAt(r.assetId, addDays(d.date, -1));
    const fresh = py && py.price && py.date >= addDays(d.date, -4);
    return { r, ch: fresh ? r.price.price / py.price - 1 : 0 };
  });
  const seen = new Set();
  const byAsset = movers.filter(m => { if (seen.has(m.r.assetId)) return false; seen.add(m.r.assetId); return true; });
  const top = byAsset.filter(m => m.ch > 0).sort((a, b) => b.ch - a.ch).slice(0, 3);
  const bottom = byAsset.filter(m => m.ch < 0).sort((a, b) => a.ch - b.ch).slice(0, 3);
  const mvList = l => l.length ? l.map(m => `<div class="mv"><span>${esc(m.r.asset.ticker.replace(/_.*/, ''))}</span><span class="num ${cls(m.ch)}">${arrow(m.ch)}${pct(Math.abs(m.ch))}</span></div>`).join('') : '<div class="muted" style="font-size:14px">—</div>';

  el.innerHTML = notices() + `
    ${S.demo ? `<div class="demo-note"><span>Это демо-данные: цены и сделки вымышленные.</span><button data-act="clear-demo">Начать с нуля</button></div>` : ''}
    <div class="card">
      <div class="label">Стоимость портфеля</div>
      <div class="hero num">${money(s.total, base, { digits: 0 })}</div>
      <div class="num ${cls(dayChange)}" style="font-weight:600">${arrow(dayChange)}${money(Math.abs(dayChange), base, { digits: 0 })} · ${pct(Math.abs(dayChange ? dayPct : 0))} <span class="muted" style="font-weight:400">за день</span></div>
      <div class="stats">
        <div><div class="label">Прибыль за всё время</div><div class="v num ${cls(pnl)}">${arrow(pnl)}${money(Math.abs(pnl), base, { digits: 0 })}</div><div class="num ${cls(pnl)}" style="font-size:13px">${pct(pnlPct, true)}</div></div>
        <div><div class="label">Доходность, годовых (XIRR)</div><div class="v num ${cls(d.xirr || 0)}">${d.xirr == null ? '—' : pct(d.xirr, true)}</div></div>
        <div><div class="label">Вложено</div><div class="v num">${money(d.contributed, base, { digits: 0 })}</div></div>
        <div><div class="label">Выплаты получены</div><div class="v num">${money(s.income, base, { digits: 0 })}</div></div>
      </div>
      ${s.missingPrices.length ? `<p class="hint" style="margin:10px 0 0">Нет цены для ${s.missingPrices.length} бумаг — они учтены по себестоимости.</p>` : ''}
    </div>

    <div class="card">
      <div class="row"><h2 style="margin:0">Динамика</h2></div>
      <div class="seg" style="margin-top:10px" role="tablist">${PERIODS.map(p => `<button data-period="${p[0]}" class="${p[0] === UI.period ? 'on' : ''}" role="tab" aria-selected="${p[0] === UI.period}">${p[1]}</button>`).join('')}</div>
      <div class="chart" id="hist-chart" aria-hidden="true"></div>
      <div class="sr"><table><caption>Динамика стоимости портфеля</caption><tr><th>Дата</th><th>Стоимость</th><th>Вложено</th></tr>${hist.labels.map((l, i) => i % 8 === 0 || i === hist.labels.length - 1 ? `<tr><td>${esc(l)}</td><td>${money(hist.value[i], base, { digits: 0 })}</td><td>${money(hist.invested[i], base, { digits: 0 })}</td></tr>` : '').join('')}</table></div>
      <div class="legend"><span><i style="background:var(--s1)"></i>Стоимость</span><span><i class="dash"></i>Вложено</span></div>
    </div>

    <div class="card">
      <h2>Структура</h2>
      <div class="chips">${[['class', 'Классы'], ['currency', 'Валюты'], ['sector', 'Секторы'], ['account', 'Счета']].map(a => `<button class="chip ${UI.alloc === a[0] ? 'on' : ''}" data-alloc="${a[0]}">${a[1]}</button>`).join('')}</div>
      <div class="donut-wrap"><div id="donut" role="group" aria-label="Структура: нажмите на сектор"></div>
        <ul class="alloc">${alloc.map(a => `<li><i style="background:${a.color}"></i><span class="n">${esc(UI.alloc === 'account' ? (d.accounts[a.key] || {}).name || a.label : a.label)}</span><span class="p num">${pct(allocTotal ? a.value / allocTotal : 0)}</span></li>`).join('')}</ul>
      </div>
      <div class="donut-sel">${(() => { const a = alloc.find(x => x.key === UI.allocSel);
        return a ? `<i style="background:${a.color}"></i><span>${esc(UI.alloc === 'account' ? (d.accounts[a.key] || {}).name || a.label : a.label)}</span><b class="num">${money(a.value, base, { digits: 0 })}</b><span class="muted num">${pct(allocTotal ? a.value / allocTotal : 0)}</span>`
          : '<span class="muted" style="font-size:12.5px">Нажмите на сектор, чтобы увидеть сумму</span>'; })()}</div>
    </div>

    <div class="card">
      <h2>За день</h2>
      <div class="movers"><div><h3>Рост</h3>${mvList(top)}</div><div><h3>Падение</h3>${mvList(bottom)}</div></div>
    </div>`;
  const fmt = v => money(v, base, { digits: 0 });
  lineChart(document.getElementById('hist-chart'), hist.labels, [
    { name: 'Стоимость', color: 'var(--s1)', values: hist.value },
    { name: 'Вложено', color: 'var(--muted)', dash: true, values: hist.invested }
  ], fmt);
  if (UI.allocSel && !alloc.some(a => a.key === UI.allocSel)) UI.allocSel = null;
  donut(document.getElementById('donut'), alloc, '');
  document.getElementById('donut').classList.toggle('has-sel', !!UI.allocSel);
}

/* ================= экран: позиции ================= */

      <div class="hero num">${money(total, base, { digits: 0 })}</div>
      ${segs.length > 1 ? `<div class="label">${segs.map(g => `${esc(segName(g.cur))}: ${money(g.valueBase, base, { digits: 0 })}`).join(' · ')}</div>` : ''}
    </div>` : ''}
    ${segs.map(g => `<section class="card" aria-label="${esc(segName(g.cur))}">
      <div class="seg-head">
        <h2>${esc(segName(g.cur))}</h2>
        <div class="seg-sum">
          <div class="num v">${money(g.value, g.cur, g.cur === base ? { digits: 0 } : {})}</div>
          ${g.cur !== base ? `<div class="num label">≈ ${money(g.valueBase, base, { digits: 0 })}</div>` : ''}
          <div class="num s ${cls(g.pnl)}">${arrow(g.pnl)}${money(Math.abs(g.pnl), g.cur, g.cur === base ? { digits: 0 } : {})} · ${pct(Math.abs(g.cost ? g.pnl / g.cost : 0))}</div>

      <ul class="list" style="margin-top:6px">${g.rows.map(r => `
        <li class="item tap" data-asset="${esc(r.assetId)}" data-account="${esc(r.accountId)}">

          <div class="main kb" tabindex="0" role="button"><div class="t">${esc(r.asset.name)}</div><div class="s num">${C.formatQty(r.qty)} шт · ${esc((d.accounts[r.accountId] || {}).name || '')}${r.hasPrice ? (r.price.source !== 'demo' && QT.isStale(r.asset, r.price, Date.now()) ? ' · <span class="stale">цена устарела</span>' : '') : ' · нет цены'}</div></div>
          <div class="r"><div class="t num">${money(r.value, r.currency, r.currency === base ? { digits: 0 } : {})}</div><div class="s num ${cls(r.pnl)}">${arrow(r.pnl)}${pct(Math.abs(r.pnlPct || 0))}</div></div>

const SEG_NAMES = { KZT: 'Тенговые позиции', USD: 'Долларовые позиции', EUR: 'Позиции в евро', RUB: 'Рублёвые позиции', CNY: 'Позиции в юанях', GBP: 'Позиции в фунтах' };
function segName(cur) { return SEG_NAMES[cur] || 'Позиции в ' + cur; }

function plural(n, one, few, many) {
  const m10 = n % 10, m100 = n % 100;
  if (m10 === 1 && m100 !== 11) return one;
  if (m10 >= 2 && m10 <= 4 && (m100 < 10 || m100 >= 20)) return few;
  return many;
}

function openAsset(assetId, accountId) {

  const hist = (S.prices[assetId] || []).filter(x => x.date >= addDays(d.date, -365));
  const step = Math.max(1, Math.ceil(hist.length / 90));
  const pts = hist.filter((x, i) => i % step === 0 || i === hist.length - 1);
  const txs = S.txs.filter(t => t.assetId === assetId && (!accountId || t.accountId === accountId || t.toAccountId === accountId)).sort((x, y) => y.date < x.date ? -1 : 1);
  const cur = a.currency;
  openSheet(`
    <div class="sh"><div><h2 id="sheet-title">${esc(a.ticker.replace(/_.*/, ''))}</h2><div class="label">${esc(a.name)} · ${esc(a.exchange || '')} · ${esc(CLASS_LABELS[a.class] || '')}</div></div>

    <div class="card">

      ${QT.routeFor(a).length ? `<p class="hint" style="margin:8px 0 0">Котировки: ${QT.routeFor(a).map(sourceLabel).join(' → ')}${a.quoteSymbol ? ' · тикер ' + esc(a.quoteSymbol) : ''}</p>` : `<p class="hint" style="margin:8px 0 0">Цена обновляется только вручную.</p>`}
    </div>

      <div><div class="label">Прибыль (не зафиксирована)</div><div class="v num ${cls(r ? r.pnl : 0)}">${r ? arrow(r.pnl) + money(Math.abs(r.pnl), cur) + ' · ' + pct(Math.abs(r.pnlPct || 0)) : '—'}</div></div>

  if (pts.length > 1) lineChart(document.getElementById('asset-chart'), pts.map(x => fdate(x.date)), [{ name: 'Цена', color: 'var(--s1)', values: pts.map(x => x.price) }], v => fprice(v, cur, a));

const sourceLabel = s => QT.SOURCE_LABELS[s] || s || '';
// «KASE · 14:32» для сегодняшней цены, «KASE · 27 сен» для более ранней; «устарела», если рынок с тех пор торговался
function priceMeta(asset, pr) {
  if (!pr) return 'Цена не загружена';
  const today = pr.date === C.today();
  const t = pr.fetchedAt && today ? (pr.time || new Date(pr.fetchedAt).toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' })) : fdate(pr.date, true) + (pr.time ? ', ' + pr.time : '');
  const stale = pr.source !== 'demo' && QT.isStale(asset, pr, Date.now());
  return esc(sourceLabel(pr.source)) + ' · ' + t + (stale ? ' · <span class="stale">устарела</span>' : '');
}

const parseNum = s => { const v = Number(String(s).replace(/[\s ]/g, '').replace(',', '.')); return isFinite(v) ? v : NaN; };

/* ================= экран: операции ================= */

function txSign(t) {
  const a = t.amount || 0, fee = t.fee || 0, tax = t.tax || 0;
  switch (t.type) {
    case 'buy': return -(a + fee);
    case 'sell': return a - fee;
    case 'dividend': case 'coupon': return a - tax;
    case 'deposit': return a;
    case 'withdraw': case 'fee': case 'tax': return -a;
    case 'transfer': return t.assetId ? 0 : -a;
    default: return 0;
  }
}
function opItem(t) {
  const d = derive(), a = t.assetId ? d.assets[t.assetId] : null, acc = d.accounts[t.accountId];
  const title = TYPE_LABELS[t.type] + (a ? ' ' + a.ticker.replace(/_.*/, '') : '');
  let sub = '';
  if ((t.type === 'buy' || t.type === 'sell') && t.quantity) sub = C.formatQty(t.quantity) + ' шт' + (t.price ? ' × ' + fprice(t.price, t.currency, a) : '') + ' · ';
  if (t.type === 'split' && t.ratio) sub = t.ratio.num + ':' + t.ratio.den + ' · ';
  if (t.type === 'transfer') sub = '→ ' + ((d.accounts[t.toAccountId] || {}).name || '?') + ' · ';
  sub += (acc ? acc.name : '') + (t.note ? ' · ' + t.note : '');
  const v = txSign(t);
  const icon = { buy: '＋', sell: '−', dividend: '₸', coupon: '%', deposit: '↓', withdraw: '↑', fee: '·', tax: '·', split: '÷', transfer: '⇄' }[t.type];
  // свайп влево открывает «Изменить» и «Удалить»; с клавиатуры те же действия — в карточке операции
  return `<li class="item sw"><div class="sw-a" aria-hidden="true"><button class="e" data-act="edit-tx" data-id="${esc(t.id)}" tabindex="-1">Изменить</button><button class="d" data-act="del-tx" data-id="${esc(t.id)}" tabindex="-1">Удалить</button></div>
    <div class="sw-c tap" data-tx="${esc(t.id)}" tabindex="0" role="button"><div class="badge" aria-hidden="true" style="font-size:16px">${icon}</div>
    <div class="main"><div class="t">${esc(title)}</div><div class="s num">${esc(sub)}</div></div>
    <div class="r"><div class="t num ${v > 0 ? 'up' : ''}">${v ? money(v, t.currency, { sign: true }) : ''}</div><div class="s">${fdate(t.date)}</div></div></div></li>`;
}

function renderOps() {

const QUICK_RE = /^\s*(купил[аи]?|продал[аи]?|buy|sell)\s+([\d\s.,]+)\s+([a-zа-я0-9_.\-]+)\s+(?:по|@|за)\s+([\d\s.,]+)\s*$/i;

function parseQuick(text) {
  const m = QUICK_RE.exec(text);
  if (!m) return null;
  return { type: /^(прод|sell)/i.test(m[1]) ? 'sell' : 'buy', qty: m[2].trim(), ticker: m[3].toUpperCase(), price: m[4].trim() };
}

      <label class="field"><span class="price-l">Цена за 1 шт</span><input class="input num" name="price" inputmode="decimal" value="${t.price ? String(t.price).replace('.', ',') : ''}"></label>
    </div>
    <div class="grid2 f-split"><label class="field"><span>Было</span><input class="input num" name="rDen" inputmode="numeric" value="${t.ratio ? t.ratio.den : 1}"></label><label class="field"><span>Стало</span><input class="input num" name="rNum" inputmode="numeric" value="${t.ratio ? t.ratio.num : 2}"></label></div>
    <div class="grid2">
      <label class="field f-amount"><span class="amount-l">Сумма</span><input class="input num" name="amount" inputmode="decimal" value="${moneyStr(t.amount, cur)}"></label>
      <label class="field f-cur"><span>Валюта</span><select class="input" name="currency">${CURRENCIES.map(x => `<option ${x === cur ? 'selected' : ''}>${x}</option>`).join('')}</select></label>
    </div>
    <div class="grid2">
      <label class="field f-fee"><span>Комиссия</span><input class="input num" name="fee" inputmode="decimal" value="${moneyStr(t.fee, cur)}"></label>
      <label class="field f-tax"><span>Налог удержан</span><input class="input num" name="tax" inputmode="decimal" value="${moneyStr(t.tax, cur)}"></label>
    </div>
    <label class="field"><span>Заметка</span><input class="input" name="note" value="${esc(t.note || '')}"></label>
    <p class="err" id="tx-err" role="alert"></p>
    <button class="btn primary block">${existing ? 'Сохранить' : 'Добавить'}</button>
  </form>`);

  const f = document.getElementById('tx-form');
  const show = (sel, on) => f.querySelectorAll(sel).forEach(x => { x.hidden = !on; });
  let amountTouched = !!existing;
  function selAsset() { return f.assetId.value && f.assetId.value !== '__new' ? byId(S.assets)[f.assetId.value] : null; }
  function update() {
    const type = f.type.value;
    const trade = type === 'buy' || type === 'sell';
    const needAsset = ['buy', 'sell', 'dividend', 'coupon', 'split'].includes(type);
    const optAsset = ['fee', 'tax', 'transfer'].includes(type);
    show('.f-asset', needAsset || optAsset);
    show('.f-new', (needAsset || optAsset) && f.assetId.value === '__new');
    show('.f-face', f.nClass.value === 'bond');
    show('.f-trade', trade || (type === 'transfer' && f.assetId.value));
    f.querySelector('.f-trade .field:last-child').hidden = !trade;
    show('.f-split', type === 'split');
    show('.f-to', type === 'transfer');
    show('.f-amount', type !== 'split' && !(type === 'transfer' && f.assetId.value));
    show('.f-fee', trade || type === 'transfer');
    show('.f-tax', type === 'dividend' || type === 'coupon');
    const a = selAsset();
    const assetCur = a ? a.currency : (f.assetId.value === '__new' ? f.nCurrency.value : null);
    show('.f-cur', !assetCur);
    if (assetCur) f.currency.value = assetCur;
    const isBond = (a && a.class === 'bond') || (f.assetId.value === '__new' && f.nClass.value === 'bond');
    f.querySelector('.price-l').textContent = isBond ? 'Цена, % от номинала' : 'Цена за 1 шт';
    f.querySelector('.amount-l').textContent = trade ? 'Сумма сделки' : type === 'dividend' || type === 'coupon' ? 'Начислено (до налога)' : 'Сумма';
    f.querySelectorAll('[data-type]').forEach(b => { b.classList.toggle('on', b.dataset.type === type); b.setAttribute('aria-checked', b.dataset.type === type); });
  }
  function autoAmount() {
    if (amountTouched) return;
    const type = f.type.value;
    if (type !== 'buy' && type !== 'sell') return;
    const q = C.parseQty(f.quantity.value), p = parseNum(f.price.value);
    if (!(q > 0) || !(p > 0)) return;
    const a = selAsset() || (f.assetId.value === '__new' ? { class: f.nClass.value, faceValue: parseNum(f.nFace.value) } : null);
    const cur = f.currency.value;
    f.amount.value = C.moneyToNumber(C.calcAmount(q, p, cur, a), cur).toString().replace('.', ',');
  }
  f.addEventListener('click', e => {
    const b = e.target.closest('[data-type]');
    if (b) { f.type.value = b.dataset.type; update(); }
  });
  f.assetId.addEventListener('change', () => {
    update();
    const a = selAsset();
    if (a && (f.type.value === 'buy' || f.type.value === 'sell') && !f.price.value) {
      const pr = priceAt(a.id, f.date.value || C.today());
      if (pr) { f.price.value = String(pr.price).replace('.', ','); autoAmount(); }
    }
  });
  ['nClass', 'nCurrency'].forEach(n => f[n].addEventListener('change', update));
  ['quantity', 'price'].forEach(n => f[n].addEventListener('input', autoAmount));
  f.amount.addEventListener('input', () => { amountTouched = !!f.amount.value; });
  if (f.quick) f.quick.addEventListener('input', () => {
    const r = parseQuick(f.quick.value);
    if (!r) return;
    f.type.value = r.type;
    const a = S.assets.find(x => x.ticker.toUpperCase() === r.ticker || x.ticker.toUpperCase().split('_')[0] === r.ticker);
    if (a) f.assetId.value = a.id; else { f.assetId.value = '__new'; f.nTicker.value = r.ticker; }
    f.quantity.value = r.qty; f.price.value = r.price;
    amountTouched = false; update(); autoAmount();
  });
  f.addEventListener('input', () => { document.getElementById('tx-err').textContent = ''; });
  update();

  f.addEventListener('submit', e => {
    e.preventDefault();
    const err = document.getElementById('tx-err');
    err.textContent = '';
    const fail = m => { err.textContent = m; };
    // выражения калькулятора в полях сумм — заменить результатом или сообщить об ошибке
    const CALC_NAMES = { amount: 'Сумма', price: 'Цена', fee: 'Комиссия', tax: 'Налог' };
    for (const name of CALC_FIELDS) {
      const inp = f[name];
      if (inp && !inp.closest('.field').hidden && !Calc.resolve(false, inp)) return fail('Проверьте выражение в поле «' + CALC_NAMES[name] + '»');
    }
    const type = f.type.value;
    const trade = type === 'buy' || type === 'sell';
    let assetId = f.assetId.value || null, newAsset = null;
    const needAsset = ['buy', 'sell', 'dividend', 'coupon', 'split'].includes(type);
    if (assetId === '__new') {
      const ticker = f.nTicker.value.trim().toUpperCase();
      if (!ticker) return fail('Введите тикер нового актива');
      if (S.assets.some(a => a.ticker.toUpperCase() === ticker)) return fail('Актив с тикером ' + ticker + ' уже есть — выберите его из списка');
      newAsset = { id: C.uid(), ticker, name: f.nName.value.trim() || ticker, class: f.nClass.value, currency: f.nCurrency.value, exchange: f.nExchange.value };
      if (newAsset.class === 'bond') newAsset.faceValue = parseNum(f.nFace.value) || 1000;
      assetId = newAsset.id;
    }
    if (needAsset && !assetId) return fail('Выберите актив');
    if (!(['fee', 'tax', 'transfer'].includes(type) || needAsset)) assetId = null;
    if (!f.date.value) return fail('Укажите дату');
    if (!f.accountId.value) return fail('Сначала создайте счёт в разделе «Ещё»');
    const currency = f.currency.value;
    const tx = { id: existing ? existing.id : C.uid(), seq: existing ? existing.seq : ++S.seq, type, date: f.date.value, accountId: f.accountId.value, currency };
    if (assetId) tx.assetId = assetId;
    if (f.note.value.trim()) tx.note = f.note.value.trim();
    if (trade || (type === 'transfer' && assetId)) {
      tx.quantity = C.parseQty(f.quantity.value);
      if (!(tx.quantity > 0)) return fail('Введите количество больше нуля');
    }
    if (trade) {
      const p = parseNum(f.price.value);
      if (p > 0) tx.price = p;
    }
    if (type === 'split') {
      const num = parseInt(f.rNum.value, 10), den = parseInt(f.rDen.value, 10);
      if (!(num > 0 && den > 0)) return fail('Укажите коэффициент сплита, например 1 → 2');
      tx.ratio = { num, den };
    } else if (!(type === 'transfer' && assetId)) {
      tx.amount = C.parseMoney(f.amount.value, currency);
      if (!(tx.amount > 0)) return fail('Введите сумму больше нуля');
    }
    if (f.fee.value && !f.fee.closest('.field').hidden) { tx.fee = C.parseMoney(f.fee.value, currency); if (tx.fee == null || tx.fee < 0) return fail('Комиссия указана неверно'); }
    if (f.tax.value && !f.tax.closest('.field').hidden) { tx.tax = C.parseMoney(f.tax.value, currency); if (tx.tax == null || tx.tax < 0) return fail('Налог указан неверно'); }
    if (type === 'transfer') {
      tx.toAccountId = f.toAccountId.value;
      if (tx.toAccountId === tx.accountId) return fail('Счета отправителя и получателя совпадают');
    }
    // проверка на согласованность: например, нельзя продать больше, чем есть
    const others = S.txs.filter(x => x.id !== tx.id);
    const check = C.computePortfolio(others.concat([tx]), { method: S.settings.method });
    const before = C.computePortfolio(others, { method: S.settings.method });
    const own = check.errors.find(x => x.tx === tx);
    if (own) return fail(own.message);
    if (check.errors.length > before.errors.length) return fail('Операция делает некорректными более поздние операции: ' + check.errors[check.errors.length - 1].message);
    if (newAsset) S.assets.push(newAsset);
    if (existing) S.txs[S.txs.findIndex(x => x.id === tx.id)] = tx; else S.txs.push(tx);
    if (trade && tx.price && (!priceAt(assetId, C.today()) || newAsset)) {
      // первая цена актива — из сделки, пока не подключены котировки
      const list = S.prices[assetId] = S.prices[assetId] || [];
      if (!list.some(x => x.date === tx.date)) { list.push({ date: tx.date, price: tx.price, source: 'manual' }); list.sort((x, y) => x.date < y.date ? -1 : 1); }
    }
    commit(); closeSheet();
    toast(existing ? 'Сохранено' : TYPE_LABELS[type] + ' добавлена');
    Quotes.update();
  });
}

const AN_PERIODS = [['month', 'Месяц'], ['prev-month', 'Прошлый месяц'], ['quarter', 'Квартал'], ['year', 'Год'],
  ['prev-year', 'Прошлый год'], ['12m', '12 месяцев'], ['all', 'Всё время'], ['custom', 'Период…']];

// данные аналитики за выбранный период; считаются один раз до следующего изменения данных
function analyticsData() {
  const d = derive(), today = d.date, an = UI.an, method = S.settings.method;
  const first = S.txs.reduce((m, t) => t.date < m ? t.date : m, today);
  let [from, to] = an.period === 'custom' ? [an.from || first, an.to || today] : C.periodRange(an.period, today, first);
  if (from > to) [from, to] = [to, from];
  const acc = an.account === 'all' ? null : an.account;
  const key = [from, to, acc, method].join('|');
  d.an = d.an || {};
  if (d.an[key]) return d.an[key];
  const txs = acc ? S.txs.filter(t => t.accountId === acc || t.toAccountId === acc) : S.txs;
  const events = C.computePortfolio(S.txs, { method }).realizedEvents;
  const opt = (a, b) => ({ from: a, to: b, fx: d.fx, base: d.base, accountId: acc, realizedEvents: events });
  const flows = C.periodFlows(S.txs, opt(from, to));
  const [pf, pt] = C.previousRange(from, to);
  const prev = C.periodFlows(S.txs, opt(pf, pt));
  // стоимость на дату: операции до этой даты, цены и курсы на эту дату
  const valueAt = date => {
    const st = C.computePortfolio(txs.filter(t => t.date <= date), { method });
    return C.summarize(st, Object.assign({}, d.ctx, { prices: pricesAt(date), date })).total;
  };
  // вложения инвестора (плюс — внесено, минус — выведено), как в расчёте доходности
  const contrib = C.investorFlows(txs, { rows: [] }, { fx: d.fx, base: d.base, date: today, cash: {}, accounts: d.accounts })
    .map(f => ({ date: f.date, amount: -f.amount }));
  const contribIn = (a, b) => contrib.filter(f => f.date >= a && f.date <= b);
  const v0 = valueAt(C.addDaysIso(from, -1)), v1 = valueAt(to);
  const dz = C.modifiedDietz(v0, v1, contribIn(from, to), from, to);
  const bk = C.periodBuckets(from, to);
  let pv = v0;
  const buckets = bk.list.map(b => {
    const f = C.periodFlows(S.txs, opt(b.from, b.to)), v = valueAt(b.to);
    const g = C.modifiedDietz(pv, v, contribIn(b.from, b.to), b.from, b.to);
    pv = v;
    return { label: b.label, from: b.from, to: b.to, div: f.dividends, cpn: f.coupons, dep: f.deposits, wd: f.withdrawals, gain: g.gain };
  });
  const pays = txs.filter(t => (t.type === 'dividend' || t.type === 'coupon') && t.date >= from && t.date <= to)
    .sort((a, b) => a.date < b.date ? 1 : a.date > b.date ? -1 : 0);
  return (d.an[key] = { from, to, acc, flows, prev, v0, v1, dz, unit: bk.unit, buckets, pays });
}

    el.innerHTML = `<div class="card empty"><h2>Пока нечего анализировать</h2><p>Добавьте сделки, пополнения и выплаты — здесь появятся итоги по периодам.</p><button class="btn primary" data-act="add">Добавить операцию</button></div>`;
    return;
  }
  const d = derive(), base = d.base, an = UI.an, A = analyticsData(), f = A.flows;

  const groups = [];
  A.pays.forEach(t => { const k = t.date.slice(0, 7); let g = groups[groups.length - 1]; if (!g || g.k !== k) groups.push(g = { k, list: [], sum: 0 }); g.list.push(t); g.sum += d.fx.convert((t.amount || 0) - (t.tax || 0), t.currency, base, t.date) || 0; });

    ${accounts.length > 1 ? `<select class="input" id="an-acc" aria-label="Счёт" style="margin:4px 0 10px"><option value="all">Все счета</option>${accounts.map(a => `<option value="${a.id}" ${an.account === a.id ? 'selected' : ''}>${esc(a.name)}</option>`).join('')}</select>` : ''}

    <div class="card">
      <div class="label">${fdate(A.from, true)} – ${fdate(A.to, true)} · ${days} ${plural(days, 'день', 'дня', 'дней')}</div>
      <div class="label" style="margin-top:8px">Прирост портфеля</div>
      <div class="hero num ${cls(A.dz.gain)}">${arrow(A.dz.gain)}${m(Math.abs(A.dz.gain))}</div>
      <div class="label">Доходность за период: <b class="num ${cls(A.dz.ret || 0)}">${A.dz.ret == null ? '—' : pct(A.dz.ret, true)}</b></div>
      <div class="stats">
        <div><div class="label">Стоимость на начало</div><div class="v num">${m(A.v0)}</div></div>
        <div><div class="label">Стоимость на конец</div><div class="v num">${m(A.v1)}</div></div>
        <div><div class="label">Пополнения</div><div class="v num">${m(f.deposits)}</div></div>

      </div>
      <p class="hint" style="margin:10px 0 0">Прирост — изменение стоимости без учёта пополнений и выводов. Доходность учитывает, когда внутри периода вносились деньги.</p>
    </div>

    <div class="card">

        : '<div class="muted" style="font-size:14px">В этом периоде выплат не было.</div>'}
    </div>

    ${groups.slice(0, an.limit).map(g => `<div class="group-h row"><span>${MONTHS_N[+g.k.slice(5) - 1]} ${g.k.slice(0, 4)}</span><span class="num">${m(g.sum)}</span></div><div class="card" style="padding:4px 16px"><ul class="list">${g.list.map(opItem).join('')}</ul></div>`).join('')}
    ${groups.length > an.limit ? '<button class="btn block" data-act="an-more">Показать ещё выплаты</button>' : ''}`;
  const labels = A.buckets.map(b => b.label);
  const series = metric === 'payouts'
    ? [{ name: 'Дивиденды', color: 'var(--s1)', values: A.buckets.map(b => b.div) }, { name: 'Купоны', color: 'var(--s2)', values: A.buckets.map(b => b.cpn) }]
    : metric === 'cash'
