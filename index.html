  eye.setAttribute('aria-label', S.settings.hideAmounts ? 'Показать суммы' : 'Скрыть суммы');
  eye.innerHTML = S.settings.hideAmounts
    ? '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 3l18 18M10.6 5.1A10 10 0 0 1 12 5c6 0 10 7 10 7a17 17 0 0 1-3 3.7M6.6 6.6C3.9 8.3 2 12 2 12s4 7 10 7a9.7 9.7 0 0 0 5.4-1.6"/><path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"/></svg>'
    : '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>';
  applyTheme();
  document.getElementById('refresh').hidden = S.demo || !S.txs.length;
  RENDER[UI.tab]();
}
function applyTheme() {
  const t = S.settings.theme;
  if (t === 'system') document.documentElement.removeAttribute('data-theme'); else document.documentElement.setAttribute('data-theme', t);
}
function commit() { invalidate(); render(); Store.save(S); }

let lastFocus = null;
function setInert() {
  const sheetOn = document.getElementById('sheet').classList.contains('on');
  ['header.top', 'main', 'nav.tabs', '#fab'].forEach(sel => { document.querySelector(sel).inert = sheetOn || Lock.on; });
  document.getElementById('sheet').inert = !sheetOn || Lock.on;
}
function openSheet(html) {
  const sh = document.getElementById('sheet');
  if (!sh.classList.contains('on')) lastFocus = document.activeElement;
  sh.innerHTML = '<div class="grab" aria-hidden="true"></div>' + html;
  sh.scrollTop = 0;
  const title = sh.querySelector('#sheet-title');
  if (title) { sh.removeAttribute('aria-label'); sh.setAttribute('aria-labelledby', 'sheet-title'); }
  else { sh.removeAttribute('aria-labelledby'); sh.setAttribute('aria-label', 'Окно'); }
  sh.classList.add('on'); document.getElementById('sheet-bg').classList.add('on');
  setInert();
  const first = sh.querySelector('input:not([type=hidden]),select,button:not([data-act=close])');
  setTimeout(() => (first || sh).focus && (first || sh).focus({ preventScroll: true }), 50);
}
function closeSheet() {
  if (!document.getElementById('sheet').classList.contains('on')) return;
  document.getElementById('sheet').classList.remove('on'); document.getElementById('sheet-bg').classList.remove('on');
  setInert();
  if (lastFocus && lastFocus.focus) lastFocus.focus({ preventScroll: true });
}

let toastTimer = null;
function toast(msg, actionLabel, action) {
  const el = document.getElementById('toast');
  el.innerHTML = `<span>${esc(msg)}</span>` + (actionLabel ? `<button>${esc(actionLabel)}</button>` : '');
  if (action) el.querySelector('button').onclick = () => { el.classList.remove('on'); clearTimeout(toastTimer); action(); };
  el.classList.add('on');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('on'), actionLabel ? 5000 : 2200);
}

/* ================= события ================= */

document.addEventListener('click', e => {
  if (!S) return;
  const tab = e.target.closest('nav.tabs [data-tab]');
  if (tab) { UI.tab = tab.dataset.tab; render(); window.scrollTo(0, 0); return; }
  const per = e.target.closest('[data-period]');
  if (per) { UI.period = per.dataset.period; render(); return; }
  const al = e.target.closest('[data-alloc]');
  if (al) { UI.alloc = al.dataset.alloc; render(); return; }
  const pc = e.target.closest('[data-posclass]');
  if (pc) { UI.posClass = pc.dataset.posclass; render(); return; }
  const ot = e.target.closest('[data-opstype]');
  if (ot) { UI.opsType = ot.dataset.opstype; UI.opsLimit = 6; render(); return; }
  const asset = e.target.closest('[data-asset]:not([data-act])');
  if (asset) { openAsset(asset.dataset.asset, asset.dataset.account); return; }
  const openSw = document.querySelector('.sw.open');
  if (openSw && !e.target.closest('.sw-a')) { closeSwipe(openSw); return; }
  if (Swipe.justMoved) return;
  const txEl = !e.target.closest('.sw-a') && e.target.closest('[data-tx]');
  if (txEl) { openTx(txEl.dataset.tx); return; }
  const act = e.target.closest('[data-act]');
  if (!act) return;
  switch (act.dataset.act) {
    case 'close': closeSheet(); break;
    case 'add': openTxForm(null, act.dataset.preset ? { type: act.dataset.preset } : null); break;
    case 'demo':
      if (S.txs.length && !S.demo && !confirm('Заменить ваши данные демо-данными?')) return;
      { const theme = S.settings.theme; S = makeDemo(); S.settings.theme = theme; } commit(); toast('Загружены демо-данные'); break;
    case 'clear-demo':
      if (!confirm('Удалить демо-данные и начать с пустого портфеля?')) return;
      { const theme = S.settings.theme; S = initialState(); S.settings.theme = theme; } commit(); break;
    case 'wipe':
      if (!confirm('Удалить все счета, операции и цены? Это нельзя отменить.')) return;
      S = initialState(); commit(); toast('Данные удалены'); break;
    case 'del-tx': deleteTx(act.dataset.id); break;
    case 'edit-tx': openTxForm(S.txs.find(x => x.id === act.dataset.id)); break;
    case 'set-price': setPriceSheet(act.dataset.asset); break;
    case 'more-ops': UI.opsLimit = (UI.opsLimit || 6) + 6; render(); break;
    case 'add-acc': addAccountSheet(); break;
    case 'export-json': exportJson(); break;
    case 'export-csv': download('portfolio-operations-' + C.today() + '.csv', C.txsToCSV(S), 'text/csv;charset=utf-8'); break;
    case 'import-json': document.getElementById('file-json').click(); break;
    case 'import-csv': document.getElementById('file-csv').click(); break;
    case 'restore': restoreBackup(act.dataset.mode); break;
    case 'csv-go': csvCommit(); break;
    case 'refresh-quotes': Quotes.update({ force: true, manual: true }); break;
    case 'check-sources': Quotes.check(); break;
    case 'edit-asset': editAssetSheet(act.dataset.asset); break;
    case 'pin-on': case 'pin-change': case 'pin-off': pinSheet(act.dataset.act.slice(4)); break;
    case 'goto-quotes': UI.tab = 'more'; render(); setTimeout(() => { const c = document.getElementById('quotes-card'); if (c) c.scrollIntoView({ behavior: 'smooth', block: 'start' }); }, 50); break;
    case 'archive-acc': { const a = S.accounts.find(x => x.id === act.dataset.id); a.archived = !a.archived; commit(); break; }
  }
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && document.getElementById('sheet').classList.contains('on')) closeSheet();
  if ((e.key === 'Enter' || e.key === ' ') && e.target.matches('.tap, .kb')) { e.preventDefault(); e.target.click(); }
});
document.addEventListener('change', e => {
  const t = e.target;
  if (t.id === 'pos-account') { UI.posAccount = t.value; render(); }
  else if (t.id === 'pos-sort') { UI.posSort = t.value; render(); }
  else if (t.id === 'set-base') { S.settings.baseCurrency = t.value; UI.contrib = null; commit(); }
  else if (t.id === 'set-theme') { S.settings.theme = t.value; commit(); }
  else if (t.id === 'set-method') { S.settings.method = t.value; commit(); }
  else if (t.id === 'set-lock') { S.settings.pin.lockAfter = +t.value; commit(); }
  else if (t.id === 'set-auto') { S.settings.autoQuotes = t.checked; commit(); if (t.checked) Quotes.update(); }
  else if (t.id === 'set-interval') { S.settings.quoteRefreshMinutes = +t.value; commit(); }
  else if (t.id === 'set-proxy') { S.settings.proxyUrl = t.value.trim(); Quotes.checks = ''; commit(); Quotes.update({ force: true }); }
  else if (t.id === 'set-token') { S.settings.proxyToken = t.value.trim(); commit(); Quotes.update({ force: true }); }
  else if (t.id === 'set-td') { S.settings.twelveDataKey = t.value.trim(); commit(); Quotes.update({ force: true }); }
  else if (t.dataset.target) { S.targets[t.dataset.target] = Math.max(0, Math.min(100, parseNum(t.value) || 0)); commit(); }
  else if (t.id === 'contrib') { const v = C.parseMoney(t.value, S.settings.baseCurrency); UI.contrib = v > 0 ? v : 0; render(); }
});
let qTimer = null;
document.addEventListener('input', e => {
  if (e.target.id === 'ops-q') {
    UI.opsQuery = e.target.value;
    clearTimeout(qTimer);
    qTimer = setTimeout(() => { const pos = e.target.selectionStart; render(); const q = document.getElementById('ops-q'); q.focus(); q.setSelectionRange(pos, pos); }, 200);
  }
});
document.getElementById('sheet-bg').addEventListener('click', closeSheet);
document.getElementById('fab').addEventListener('click', () => openTxForm());
document.getElementById('eye').addEventListener('click', () => { S.settings.hideAmounts = !S.settings.hideAmounts; render(); Store.save(S); });
if (window.matchMedia) matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => render());

if ('serviceWorker' in navigator && location.protocol !== 'file:') navigator.serviceWorker.register('sw.js', { updateViaCache: 'none' }).catch(() => {});

(async () => {
  await Store.init();
  try {
    const saved = await Store.load();
    S = saved || initialState();
  } catch (e) {
    S = initialState();
    toast('Не удалось прочитать сохранённые данные');
  }
  const boot = () => { render(); Quotes.start(); };
  if (Lock.has()) { applyTheme(); Lock.show(boot); } else boot();
})();
</script>
</body>
</html>
