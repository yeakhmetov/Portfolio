// Android-приложение: встроенный браузер не скачивает файлы, поэтому файл сохраняется во временную
// папку и открывается системное меню «Поделиться» — сохранить на Диск, в «Файлы» или отправить себе
async function nativeShareFile(name, text) {
  expectSystemUI();
  const written = await nativePlugin('Filesystem').writeFile({ path: name, data: text, directory: 'CACHE', encoding: 'utf8' });
  try {
    await nativePlugin('Share').share({ title: name, files: [written.uri], dialogTitle: 'Сохранить или отправить файл' });
    return true;
  } catch (e) {
    if (/cancel/i.test(String(e && e.message))) return false;
    throw e;
  }
}

function download(name, text, mime) {
  if (NATIVE) return nativeShareFile(name, text).catch(e => { console.error(e); toast('Не удалось сохранить файл: ' + (e && e.message || e)); return false; });
  const blob = new Blob([text], { type: mime });
  const isCsv = /\.csv$/.test(name);
  // Android пропускает в «Поделиться» не все типы файлов: JSON отправляем как текстовый файл
  let shareFile = null;
  if (navigator.share && navigator.canShare) {
    const variants = isCsv ? [[name, 'text/csv'], [name, 'text/plain']] : [[name, mime], [name.replace(/\.json$/, '.json.txt'), 'text/plain']];
    for (const [n, t] of variants) { try { const f = new File([text], n, { type: t }); if (navigator.canShare({ files: [f] })) { shareFile = f; break; } } catch (e) { /* нет File */ } }
  }
  const mobile = /iPhone|iPad|Android/i.test(navigator.userAgent);
  if (!mobile) return Promise.resolve(saveToDownloads());
  if (IS_IOS && shareFile) return navigator.share({ files: [shareFile], title: name }).then(() => true, () => false);
  const canPick = typeof window.showSaveFilePicker === 'function';
  return new Promise(res => {
    openSheet(`<div class="sh"><h2 id="sheet-title" style="font:600 17px/1.3 var(--body);word-break:break-all">${esc(name)}</h2><button class="iconbtn" data-act="close" aria-label="Закрыть">✕</button></div>
      <p class="hint" style="margin:0 0 14px">${canPick ? '«Сохранить» откроет окно выбора папки.' : '«Сохранить» положит файл в папку «Загрузки».'} «Отправить» откроет меню: Telegram, почта, Google Диск и другие.</p>
      <div class="btn-row"><button class="btn" id="dl-save">Сохранить</button><button class="btn primary" id="dl-share" ${shareFile ? '' : 'disabled'}>Отправить</button></div>`);
    let done = false;
    const finish = v => { if (!done) { done = true; res(v); } };
    document.getElementById('dl-save').onclick = async () => {
      closeSheet();
      if (canPick) {
        try {
          expectSystemUI();
          const h = await window.showSaveFilePicker({ suggestedName: name, types: [isCsv ? { description: 'Таблица CSV', accept: { 'text/csv': ['.csv'] } } : { description: 'Резервная копия', accept: { 'application/json': ['.json'] } }] });
          const w = await h.createWritable(); await w.write(blob); await w.close();
          return finish(true);
        } catch (e) { if (e && e.name === 'AbortError') return finish(false); }
      }
      finish(saveToDownloads());
    };
    // «Поделиться» вызывается прямо в обработчике нажатия, иначе Android его блокирует
    document.getElementById('dl-share').onclick = () => {
      if (!shareFile) return;
      expectSystemUI();
      navigator.share({ files: [shareFile], title: name }).then(() => { closeSheet(); finish(true); }, e => { closeSheet(); if (!(e && e.name === 'AbortError')) toast('Не удалось открыть меню «Поделиться» — сохраните файл'); finish(false); });
    };
    const obs = new MutationObserver(() => { if (!document.getElementById('sheet').classList.contains('on')) { obs.disconnect(); setTimeout(() => finish(false), 0); } });
    obs.observe(document.getElementById('sheet'), { attributes: true, attributeFilter: ['class'] });
  });
  function saveToDownloads() {
    try {
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob); a.download = name;
      document.body.appendChild(a); a.click();
      setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 4000);
      if (mobile) toast('Файл сохранён в папку «Загрузки»');
      return true;
    } catch (e) { toast('Не удалось сохранить файл'); return false; }
  }
}

function applySettings() {

  const n = pendingSettings.changes.length;

  closeSheet(); commit();
  toast('Обновлены настройки бумаг: ' + n);

}

async function restoreBackup(mode) {
  if (!pendingBackup) return;
  const data = pendingBackup.data;
  if (mode === 'replace') {
    if (S.txs.length && !S.demo && !(await ask('Заменить текущие данные копией?', 'Заменить', true, 'Текущие счета и операции будут удалены.'))) return;
    const keep = { proxyUrl: S.settings.proxyUrl, proxyToken: S.settings.proxyToken, twelveDataKey: S.settings.twelveDataKey, pin: S.settings.pin };
    S = hydrate(data);
    Object.keys(keep).forEach(k => { if (!S.settings[k]) S.settings[k] = keep[k]; });
    S.settings.lastBackupAt = S.settings.lastBackupAt || pendingBackup.exportedAt;
    toast('Данные восстановлены');
  } else {
    const r = C.mergeData(S, data);
    S = hydrate(Object.assign({}, r.data, { demo: S.demo }));
    toast('Добавлено операций: ' + r.added.txs + (r.skipped ? ', уже были: ' + r.skipped : ''));
  }
  pendingBackup = null;
  closeSheet(); commit();
  Quotes.update();
}

document.getElementById('file-csv').addEventListener('change', async e => {
  const f = e.target.files[0]; e.target.value = '';
  if (!f) return;
  let text = '';
  try {
    const buf = await f.arrayBuffer();
    text = new TextDecoder('utf-8', { fatal: true }).decode(buf);
  } catch (err) {
    // выгрузки из Excel часто в кодировке Windows-1251
    try { text = new TextDecoder('windows-1251').decode(await f.arrayBuffer()); } catch (err2) { toast('Не удалось прочитать файл'); return; }
  }
  const p = C.parseCSV(text);
  if (p.rows.length < 2) { toast('В файле нет строк с операциями'); return; }
  const acc = S.accounts.find(a => !a.archived);
  csvImport = { headers: p.rows[0], rows: p.rows.slice(1), map: C.guessMapping(p.rows[0]), accountId: acc && acc.id, currency: acc ? acc.currency : 'KZT' };
  csvSheet();
});

const TP = window.PortfolioTemplate;

document.getElementById('file-xlsx').addEventListener('change', async e => {
  const files = [...e.target.files]; e.target.value = '';

    if (other) { toast('«' + other.file.name + '» — не отчёт по комиссиям. Шаблон загружайте отдельно'); return; }
    return feeImportStart(books);

// импорт отчётов брокера по комиссиям: комиссии по датам вместо разовой «сверки с выпиской»
let feeImport = null;
function feeImportStart(books) {
  const reps = [];
  for (const b of books) {
    const r = TP.feeReportToTxs(b.book, { today: C.today() });
    if (!r.ok) { toast(b.file.name + ': ' + r.error); return; }
    reps.push(r);
  }
  reps.sort((a, b) => a.from < b.from ? -1 : 1);
  const live = S.accounts.filter(a => !a.archived);
  const guess = live.find(a => /alatau/i.test(a.name + ' ' + (a.broker || ''))) || live[0];
  if (!guess) { toast('Сначала добавьте счёт'); return; }
  feeImport = { reps, accountId: guess.id };
  feeSheet();
}
function feeResult() {
  let st = S, added = 0, updated = 0, same = 0, before = null, after = 0;
  for (const r of feeImport.reps) {
    const x = TP.applyFeeReport(st, r, feeImport.accountId);
    st = x.state; added += x.added; updated += x.updated; same += x.same;
    if (before == null) before = x.recon.before;
    after = x.recon.after;
  }
  return { st, added, updated, same, before: before || 0, after };
}
function feeSheet() {
  const { reps, accountId } = feeImport, x = feeResult();
  const tg = v => C.formatMoney(Math.round(v * 100), 'KZT');
  openSheet(`<div class="sh"><h2 id="sheet-title">Комиссии брокера</h2><button class="iconbtn" data-act="close" aria-label="Закрыть">✕</button></div>
    <div class="card"><ul class="list">${reps.map(r => `<li class="item"><div class="main"><div class="t">${r.year} год</div>
      <div class="s">брокер ${tg(r.totals.broker)} · биржи и прочие ${tg(r.totals.third)}</div></div>

  if (accId === '__new' || !base.accounts.some(a => a.id === accId)) {

  }
  const st = TP.applyImport(base, imp, accId);

}

async function xlsxCommit() {
  if (!xlsxImport) return;
  const replaced = xlsxImport.accountId !== '__new' ? S.txs.filter(t => t.accountId === xlsxImport.accountId).length : 0;
  if (replaced && !(await ask(`Заменить ${replaced} ${plural(replaced, 'операцию', 'операции', 'операций')} счёта историей из файла?`, 'Заменить', true))) return;
  const { st } = xlsxState();
  const n = xlsxImport.imp.txs.length;

function csvCommit() {
  if (!csvImport) return;
  const res = csvResult();
  S.assets.push(...res.newAssets);
  S.txs.push(...res.txs);
  S.seq = Math.max(S.seq, ...res.txs.map(t => t.seq));
  if (S.demo) S.demo = false;
  csvImport = null;
  closeSheet(); commit();
  toast('Импортировано операций: ' + res.txs.length);
  Quotes.update();
}

/* ================= котировки ================= */

const Quotes = {
  busy: false, failures: {}, checks: '', lastRun: null, lastUpdated: 0, timer: null,

  async fetchJson(url, init) {
    const ctrl = new AbortController();
    const t = setTimeout(() => ctrl.abort(), 12000);
    try {
      const r = await fetch(url, Object.assign({}, init || {}, { signal: ctrl.signal, cache: 'no-store' }));
      if (!r.ok) { const e = new Error('HTTP ' + r.status); e.code = r.status === 401 ? 'unauthorized' : 'http'; throw e; }
      return await r.json();
    } catch (e) {
      if (e.name === 'AbortError') { const x = new Error('нет ответа'); x.code = 'timeout'; throw x; }
      if (e instanceof TypeError) { const x = new Error('сеть недоступна или источник не разрешает запросы из браузера'); x.code = 'network'; throw x; }
      throw e;
    } finally { clearTimeout(t); }
  },

  heldAssets() {
    const held = new Set(derive().sum.rows.map(r => r.assetId));
    return S.assets.filter(a => held.has(a.id));
  },

  // понятное описание, почему часть котировок не может обновляться
  configIssues() {
    if (!S || S.demo || !S.settings.autoQuotes) return '';
    const held = this.heldAssets();
    const need = src => held.filter(a => QT.routeFor(a)[0] === src).map(a => a.ticker.replace(/_.*/, ''));
    const parts = [];
    const kz = need('kase').concat(need('aix'));
    if (kz.length && !S.settings.proxyUrl) parts.push(`${kz.slice(0, 4).join(', ')}${kz.length > 4 ? '…' : ''} — нужен прокси для KASE/AIX`);
    const gl = need('global').concat(need('us'));
    if (gl.length && !S.settings.twelveDataKey && !S.settings.proxyUrl) parts.push(`${gl.slice(0, 4).join(', ')} — нужен ключ Twelve Data`);
    return parts.length ? 'Котировки не обновляются: ' + parts.join('; ') + '.' : '';
  },

  statusText() {
    if (this.busy) return 'Обновление…';
    if (!this.lastRun) return S.settings.autoQuotes ? 'Цены обновятся при открытии приложения.' : 'Автообновление выключено.';
    const t = new Date(this.lastRun).toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' });
    const f = Object.keys(this.failures).filter(k => !['no-proxy', 'no-key', 'not-found'].includes(this.failures[k].code));
    return `Проверено в ${t}` + (this.lastUpdated ? `, обновлено цен: ${this.lastUpdated}` : '') +
      (f.length ? '. Ошибки: ' + f.map(k => sourceLabel(k) + ' — ' + esc(this.failures[k].message)).join('; ') : '');
  },

  setBusy(on) {
    this.busy = on;
    const b = document.getElementById('refresh');
    b.classList.toggle('busy', on);
    b.setAttribute('aria-busy', on);
  },

  async update(opts) {
    opts = opts || {};
    if (!S || this.busy) return;
    if (S.demo) { if (opts.manual) toast('В демо-режиме цены не обновляются'); return; }
    if (!opts.manual && !opts.force && !S.settings.autoQuotes) return;
    if (!navigator.onLine) { if (opts.manual) toast('Нет сети — показаны сохранённые цены'); return; }
    const assets = this.heldAssets();
    if (!assets.length) { if (opts.manual) toast('Нет бумаг для обновления'); return; }
    this.setBusy(true);
    let changed = false;
    try {
      changed = await this.updateFx(opts.force) || changed;
      const d = derive();
      const latest = {};
      assets.forEach(a => { const l = S.prices[a.id]; if (l && l.length) latest[a.id] = l[l.length - 1]; });
      const res = await QT.refreshQuotes({
        assets, latest, settings: S.settings, now: Date.now(), force: !!opts.force,
        fetchJson: (u, i) => this.fetchJson(u, i),
        fxRate: (f, t) => d.fx.rate(f, t, C.today())
      });
      res.updates.forEach(u => {
        // котировка биржи главнее цены, внесённой вручную или из Excel позже даты последней сделки:
        // в выходные биржа отдаёт цену пятницы, а импорт в субботу иначе остаётся «последней» ценой
        const list = S.prices[u.assetId] = (S.prices[u.assetId] || []).filter(x => x.date !== u.date && !(x.source === 'manual' && x.date > u.date));
        list.push(Object.assign({ date: u.date, price: u.price, source: u.source, fetchedAt: u.fetchedAt }, u.time ? { time: u.time } : {}));
        list.sort((x, y) => x.date < y.date ? -1 : x.date > y.date ? 1 : 0);
      });
      if (res.updates.length) changed = true;
      this.failures = res.failures;
      this.lastRun = Date.now();
      this.lastUpdated = res.updates.length;
      // о сбоях источника сообщаем тостом; о ненастроенных источниках — плашкой на обзоре
      const broken = Object.keys(res.failures).filter(k => !['no-proxy', 'no-key', 'not-found'].includes(res.failures[k].code));
      if (broken.length) {
        const tick = res.failures[broken[0]].tickers[0];
        const a = assets.find(x => x.ticker === tick);
        const last = a && latest[a.id];
        toast(`Не удалось обновить котировки ${broken.map(sourceLabel).join(', ')}` + (last ? `, показаны данные на ${fdate(last.date)}` : ''));
      } else if (opts.manual) toast(res.updates.length ? 'Обновлено цен: ' + res.updates.length : 'Цены актуальны');
    } catch (e) {
      console.error(e);
      if (opts.manual) toast('Не удалось обновить котировки');
    } finally {
      this.setBusy(false);
      if (changed) commit(); else render();
    }
  },

  // курсы валют — не чаще раза в 6 часов
  async updateFx(force) {
    const at = S.settings.fxFetchedAt ? Date.parse(S.settings.fxFetchedAt) : 0;
    if (!force && Date.now() - at < 6 * 3600000) return false;
    const curs = new Set(['USD']);
    S.assets.forEach(a => curs.add(a.currency));
    S.accounts.forEach(a => curs.add(a.currency));
    curs.add(S.settings.baseCurrency);
    curs.delete('KZT');
    try {
      const r = await QT.refreshFx({ settings: S.settings, currencies: Array.from(curs), fetchJson: (u, i) => this.fetchJson(u, i) });
      const today = C.today();
      r.rates.forEach(x => {
        const date = x.date || today;
        S.fx = S.fx.filter(y => !(y.date === date && y.base === x.base && y.quote === x.quote));
        S.fx.push({ date, base: x.base, quote: x.quote, rate: x.rate, source: r.source });
      });
      S.settings.fxFetchedAt = new Date().toISOString();
      invalidate();
      return true;
    } catch (e) { this.failures.fx = { code: 'error', message: e.message, tickers: [] }; return false; }
  },

  // проверка каждого источника отдельным запросом
  async check() {
    const st = S.settings, out = [];
    const el = () => document.getElementById('checks');
    const show = () => { this.checks = out.map(c => `<li><b class="${c.ok ? 'up' : 'down'}">${c.ok ? '✓' : '✗'}</b><span><b style="width:auto">${esc(c.name)}</b> — ${esc(c.msg)}</span></li>`).join(''); if (el()) el().innerHTML = this.checks; };
    out.push({ ok: true, name: 'Проверка', msg: 'идёт…' }); show(); out.length = 0;
    const run = async (name, fn) => { try { out.push({ ok: true, name, msg: await fn() }); } catch (e) { out.push({ ok: false, name, msg: e.message }); } show(); };
    const hdr = st.proxyToken ? { headers: { 'X-Access-Token': st.proxyToken } } : undefined;
    const base = (st.proxyUrl || '').replace(/\/+$/, '');
    if (base) {
      await run('Прокси', async () => {
        const h = await this.fetchJson(base + '/health', hdr);
        return 'работает; KASE, AIX и США: ' + (h.sources && h.sources.kase ? 'ключи брокера заданы' : 'не заданы ключи брокера (TN_API_KEY, TN_SECRET)');
      });
      await run('Нацбанк РК', async () => { const j = await this.fetchJson(base + '/fx', hdr); const usd = (j.rates || []).find(r => r.base === 'USD'); return usd ? 'USD = ' + usd.rate + ' ₸ на ' + fdate(usd.date, true) : 'нет курса USD'; });
      await run('KASE', async () => { const j = await this.fetchJson(base + '/quotes?symbols=kase:KCEL', hdr); const q = (j.quotes || [])[0]; if (!q) throw new Error((j.errors && j.errors['kase:KCEL']) || 'нет котировки'); return 'KCEL = ' + q.price + ' ' + (q.currency || ''); });
      await run('Freedom (США)', async () => { const j = await this.fetchJson(base + '/quotes?symbols=us:AAPL', hdr); const q = (j.quotes || [])[0]; if (!q) throw new Error((j.errors && j.errors['us:AAPL']) || 'нет котировки'); return 'AAPL = ' + q.price + ' ' + (q.currency || ''); });
      await run('AIX', async () => { const j = await this.fetchJson(base + '/quotes?symbols=aix:KAP', hdr); const q = (j.quotes || [])[0]; if (!q) throw new Error((j.errors && j.errors['aix:KAP']) || 'нет котировки'); return 'KAP = ' + q.price + ' ' + (q.currency || ''); });
    } else out.push({ ok: false, name: 'KASE, AIX, Нацбанк', msg: 'не указан адрес прокси' });
    await run('MOEX', async () => { const j = await this.fetchJson('https://iss.moex.com/iss/engines/stock/markets/shares/securities.json?iss.meta=off&iss.only=marketdata&securities=SBER&marketdata.columns=SECID,BOARDID,LAST,LCURRENTPRICE'); const q = QT.parseMoex(j).SBER; return q ? 'SBER = ' + q.price + ' ₽' : 'ответ получен'; });
    await run('CoinGecko', async () => { const j = await this.fetchJson('https://api.coingecko.com/api/v3/simple/price?ids=bitcoin&vs_currencies=usd'); return 'BTC = $' + j.bitcoin.usd; });
    if (st.twelveDataKey) await run('Twelve Data', async () => { const j = await this.fetchJson('https://api.twelvedata.com/price?symbol=AAPL&apikey=' + encodeURIComponent(st.twelveDataKey)); const q = QT.parseTwelveData(j, ['AAPL']).AAPL; if (!q) throw new Error('нет котировки'); return 'AAPL = $' + q.price; });
    else out.push({ ok: false, name: 'Twelve Data', msg: 'не указан ключ' });
    await run('Курсы (запасной)', async () => { const r = QT.parseErApi(await this.fetchJson('https://open.er-api.com/v6/latest/USD'), ['USD']); return 'USD = ' + r[0].rate + ' ₸'; });
    show();
  },

  start() {
    this.update();
    document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') this.update(); });
    window.addEventListener('online', () => this.update());
    // раз в минуту: какие цены пора обновить, решает QT.needsRefresh
    clearInterval(this.timer);
    this.timer = setInterval(() => { if (document.visibilityState === 'visible') this.update(); }, 60000);
  }
};

const SW_W = 184;
const Swipe = { justMoved: false };
function closeSwipe(li) {
  li.classList.remove('open');
  const c = li.querySelector('.sw-c'); c.style.transform = '';
}
(() => {
  let li = null, c = null, x0 = 0, y0 = 0, dx = 0, mode = null, base = 0;
  document.addEventListener('touchstart', e => {
    const el = e.target.closest('.sw');
    document.querySelectorAll('.sw.open').forEach(o => { if (o !== el) closeSwipe(o); });
    if (!el || el.closest('#sheet') || e.target.closest('.sw-a') || Sel.on) { li = null; return; }
    li = el; c = el.querySelector('.sw-c');
    x0 = e.touches[0].clientX; y0 = e.touches[0].clientY; dx = 0; mode = null;
    base = el.classList.contains('open') ? -SW_W : 0;
  }, { passive: true });
  document.addEventListener('touchmove', e => {
    if (!li) return;
    const mx = e.touches[0].clientX - x0, my = e.touches[0].clientY - y0;
    if (!mode) {
      if (Math.abs(mx) > 10 && Math.abs(mx) > Math.abs(my)) mode = 'h';
      else if (Math.abs(my) > 10) { li = null; return; }
      else return;
    }
    dx = Math.min(0, Math.max(-SW_W - 30, base + mx));
    c.style.transition = 'none';
    c.style.transform = `translateX(${dx}px)`;
  }, { passive: true });
  document.addEventListener('touchend', () => {
    if (!li || mode !== 'h') { li = null; return; }
    c.style.transition = '';
    const open = dx < -SW_W / 2;
    li.classList.toggle('open', open);
    c.style.transform = open ? `translateX(-${SW_W}px)` : '';
    Swipe.justMoved = true; setTimeout(() => { Swipe.justMoved = false; }, 400);
    li = null;
  });
})();

/* ================= PIN-код и блокировка ================= */

// Вход по отпечатку / Face ID. В браузере — WebAuthn (ключ платформы), в APK — нативный модуль.
// Флаг хранится только на этом устройстве и не попадает в резервную копию.
const Bio = {
  KEY: 'portfolio:bio', busy: false, doneAt: 0,
  label() { return IS_IOS ? 'Face ID' : 'Отпечаток'; },
  enabled() { return !!lsGet(this.KEY); },
  b64(buf) { return btoa(String.fromCharCode(...new Uint8Array(buf))).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, ''); },
  unb64(s) { s = s.replace(/-/g, '+').replace(/_/g, '/'); s += '='.repeat((4 - s.length % 4) % 4); return Uint8Array.from(atob(s), c => c.charCodeAt(0)); },
  async available() {
    try {
      if (NATIVE) return !!(await nativePlugin('NativeBiometric').isAvailable()).isAvailable;
      return !!(window.PublicKeyCredential && PublicKeyCredential.isUserVerifyingPlatformAuthenticatorAvailable && await PublicKeyCredential.isUserVerifyingPlatformAuthenticatorAvailable());
    } catch (e) { return false; }
  },
  async run(fn) {
    this.busy = true;
    try { return await fn(); } finally { this.busy = false; this.doneAt = Date.now(); }
  },
  async enable() {
    if (!(await this.available())) throw new Error('unavailable');
    if (NATIVE) {
      await this.run(() => nativePlugin('NativeBiometric').verifyIdentity({ title: 'Портфель', subtitle: 'Подтвердите, чтобы включить вход по отпечатку', negativeButtonText: 'Отмена', maxAttempts: 3 }));
      lsSet(this.KEY, 'native');
      return;
    }
    const cred = await this.run(() => navigator.credentials.create({ publicKey: {
      challenge: crypto.getRandomValues(new Uint8Array(32)), rp: { name: 'Портфель' },
      user: { id: crypto.getRandomValues(new Uint8Array(16)), name: 'owner', displayName: 'Владелец' },
      pubKeyCredParams: [{ type: 'public-key', alg: -7 }, { type: 'public-key', alg: -257 }],
      authenticatorSelection: { authenticatorAttachment: 'platform', userVerification: 'required', residentKey: 'discouraged' }, timeout: 60000 } }));
    lsSet(this.KEY, this.b64(cred.rawId));
  },
  disable() { lsDel(this.KEY); },
  // бросает ошибку, если не подтверждено
  async verify(reason) {
    const id = lsGet(this.KEY);
    if (!id) throw new Error('off');
    if (NATIVE) return this.run(() => nativePlugin('NativeBiometric').verifyIdentity({ title: 'Портфель', subtitle: reason, negativeButtonText: 'Ввести PIN-код', maxAttempts: 3 }));
    return this.run(() => navigator.credentials.get({ publicKey: { challenge: crypto.getRandomValues(new Uint8Array(32)),
      allowCredentials: [{ type: 'public-key', id: this.unb64(id) }], userVerification: 'required', timeout: 60000 } }));
  }
};

// автоблокировка, секунды: 0 — сразу, -1 — никогда (только при запуске)
const LOCK_OPTIONS = [[0, 'Сразу'], [30, '30 секунд'], [60, '1 минута'], [300, '5 минут'], [900, '15 минут'], [3600, '1 час'], [-1, 'Никогда']];
function lockAfterSec() {
  const p = S.settings.pin || {};
  if (p.lockAfterSec != null) return p.lockAfterSec;
  return p.lockAfter != null ? p.lockAfter * 60 : 60;
}

const Lock = {
  on: false, entry: '', fails: 0, until: 0, onUnlock: null, hiddenAt: 0, timer: null, skipUntil: 0, bioTried: false,
  has() { return !!(S && S.settings.pin && S.settings.pin.hash && C.pinSupported()); },
  show(cb) {
    this.on = true; this.entry = ''; this.onUnlock = cb || null;
    closeSheet();
    document.getElementById('lock').hidden = false;
    document.body.classList.remove('privacy');
    setInert();
    const bio = document.getElementById('lock-bio');
    bio.textContent = Bio.label();
    bio.style.visibility = Bio.enabled() ? 'visible' : 'hidden';
    this.draw();
    // фокус на сам экран: экранный диктор прочитает заголовок, цифры можно вводить с клавиатуры
    setTimeout(() => { const el = document.querySelector('.lock-in'); if (el) el.focus({ preventScroll: true }); }, 30);
    // отпечаток предлагается сразу, один раз за показ экрана
    this.bioTried = false;
    if (Bio.enabled() && !document.hidden) setTimeout(() => { if (this.on && !this.bioTried) this.bio(); }, 250);
  },
  async bio() {
    if (!this.on || Bio.busy || !Bio.enabled()) return;
    this.bioTried = true;
    try { await Bio.verify('Разблокировать «Портфель»'); this.fails = 0; this.entry = ''; this.hide(); }
    catch (e) { this.draw(`Нажмите «${Bio.label()}», чтобы повторить, или введите PIN-код`); }
  },
  hide() {
    this.on = false;
    document.getElementById('lock').hidden = true;
    document.body.classList.remove('privacy');
    setInert();
    const cb = this.onUnlock; this.onUnlock = null;
    if (cb) cb(); else render();
  },
  draw(msg) {
    const len = S.settings.pin.len || 4;
    document.getElementById('lock-dots').innerHTML = Array.from({ length: len }, (_, i) => `<span class="${i < this.entry.length ? 'f' : ''}"></span>`).join('');
    document.getElementById('lock-count').textContent = this.entry.length ? `Введено ${this.entry.length} из ${len}` : '';
    const wait = Math.ceil((this.until - Date.now()) / 1000);
    document.getElementById('lock-err').textContent = wait > 0 ? `Слишком много попыток. Подождите ${wait} с` : (msg || '');
    document.querySelectorAll('#lock-pad button[data-key]').forEach(b => { b.disabled = wait > 0; });
    clearTimeout(this.timer);
    if (wait > 0) this.timer = setTimeout(() => this.draw(), 1000);
  },
  async press(key) {
    if (!this.on || Date.now() < this.until) return;
    const pin = S.settings.pin, len = pin.len || 4;
    if (key === 'del') this.entry = this.entry.slice(0, -1);
    else if (this.entry.length < len) this.entry += key;
    this.draw();
    if (this.entry.length < len) return;
    const ok = await C.checkPin(this.entry, pin);
    if (ok) { this.fails = 0; this.hide(); return; }
    this.fails++; this.entry = '';
    if (this.fails >= 5) this.until = Date.now() + 30000 * Math.pow(2, this.fails - 5);
    const dots = document.getElementById('lock-dots');
    dots.classList.remove('shake'); void dots.offsetWidth; dots.classList.add('shake');
    this.draw('Неверный PIN-код');
  }
};
document.getElementById('lock-pad').addEventListener('click', e => { const b = e.target.closest('[data-key]'); if (b) Lock.press(b.dataset.key); });
document.getElementById('lock-bio').addEventListener('click', () => Lock.bio());
document.addEventListener('keydown', e => {
  if (!Lock.on) return;
  if (/^[0-9]$/.test(e.key)) { e.preventDefault(); Lock.press(e.key); }
  else if (e.key === 'Backspace') { e.preventDefault(); Lock.press('del'); }
}, true);
document.getElementById('lock-forgot').addEventListener('click', async () => {
  if (!(await ask('Удалить все данные на этом устройстве?', 'Удалить', true, 'PIN-код нельзя восстановить. После удаления данные можно вернуть из резервной копии.', true))) return;
  if (!(await ask('Точно удалить все счета, операции и цены?', 'Удалить всё', true, '', true))) return;
  const theme = S.settings.theme;
  S = initialState(); S.settings.theme = theme;
  invalidate(); await Store.save(S);
  Lock.fails = 0; Lock.until = 0;
  Bio.disable();
  Lock.hide();
  toast('Данные удалены, PIN-код выключен');
});
// скрыть данные на снимке экрана в списке открытых приложений
function cloakOn() { if (S && Lock.has() && lockAfterSec() >= 0 && !Bio.busy) document.body.classList.add('privacy'); }
// системные окна, открытые приложением (выбор файла, «Поделиться»), не блокируют его при возврате
function expectSystemUI() { Lock.skipUntil = Date.now() + 10 * 60000; }
document.addEventListener('visibilitychange', () => {
  if (!S) return;
  if (Bio.busy) return; // окно отпечатка тоже сворачивает приложение
  if (document.visibilityState === 'hidden') {
    Lock.hiddenAt = Date.now();
    cloakOn();
    return;
  }
  const skip = Date.now() < Lock.skipUntil || Date.now() - Bio.doneAt < 1500;
  Lock.skipUntil = 0;
  const sec = Lock.has() ? lockAfterSec() : -1;
  if (!skip && Lock.has() && !Lock.on && sec >= 0 && Date.now() - Lock.hiddenAt >= sec * 1000) Lock.show();
  else if (Lock.on && !Lock.bioTried && Bio.enabled()) { document.body.classList.remove('privacy'); Lock.bio(); }
  else document.body.classList.remove('privacy');
});
window.addEventListener('blur', () => { const a = document.activeElement; if (a && /^(INPUT|SELECT|TEXTAREA)$/.test(a.tagName)) return; if (Date.now() < Lock.skipUntil) return; cloakOn(); });
window.addEventListener('focus', () => { if (!document.hidden && !Lock.on) document.body.classList.remove('privacy'); });
window.addEventListener('pagehide', cloakOn);
document.addEventListener('freeze', cloakOn);

async function toggleBio() {
  if (Bio.enabled()) { Bio.disable(); render(); toast(Bio.label() + ' выключен'); return; }
  if (!Lock.has()) { toast('Сначала установите PIN-код, он нужен как запасной вход'); return; }
  try { await Bio.enable(); render(); toast(Bio.label() + ' включён'); }
  catch (e) {
    if (e && /cancel|abort|NotAllowed/i.test(String(e.name || '') + String(e.message || ''))) return;
    openSheet(`<div class="sh"><h2 id="sheet-title">${Bio.label()} здесь недоступен</h2><button class="iconbtn" data-act="close" aria-label="Закрыть">✕</button></div>

      <button class="btn primary block" data-act="close">Понятно</button>`);
  }
}

function pinSheet(mode) {
  const titles = { on: 'Включить PIN-код', change: 'Изменить PIN-код', off: 'Выключить PIN-код' };
  const field = (name, label) => `<label class="field"><span>${label}</span><input class="input num" type="password" name="${name}" inputmode="numeric" pattern="[0-9]*" maxlength="6" autocomplete="off" required></label>`;
  openSheet(`<div class="sh"><h2 id="sheet-title">${titles[mode]}</h2><button class="iconbtn" data-act="close" aria-label="Закрыть">✕</button></div>
    <form id="pin-form">
      ${mode !== 'on' ? field('cur', 'Текущий PIN-код') : ''}
      ${mode !== 'off' ? field('p1', 'Новый PIN-код, 4–6 цифр') + field('p2', 'Повторите PIN-код') : ''}
      ${mode === 'on' ? '<p class="hint">Если забыть PIN-код, данные придётся удалить и восстановить из резервной копии.</p>' : ''}
      <p class="err" id="pin-err" role="alert"></p>
      <button class="btn ${mode === 'off' ? 'danger' : 'primary'} block">${mode === 'off' ? 'Выключить' : 'Сохранить'}</button>
    </form>`);
  document.getElementById('pin-form').addEventListener('submit', async e => {
    e.preventDefault();
    const f = e.target, err = m => { document.getElementById('pin-err').textContent = m; };
    if (mode !== 'on' && !(await C.checkPin(f.cur.value, S.settings.pin))) return err('Неверный текущий PIN-код');
    if (mode === 'off') { S.settings.pin = null; Bio.disable(); closeSheet(); commit(); toast('PIN-код выключен'); return; }
    if (!C.validPin(f.p1.value)) return err('PIN-код — от 4 до 6 цифр');
    if (f.p1.value !== f.p2.value) return err('PIN-коды не совпадают');
    const rec = await C.makePin(f.p1.value);
    rec.lockAfterSec = S.settings.pin ? lockAfterSec() : 60;
    delete rec.lockAfter;
    S.settings.pin = rec;
    closeSheet(); commit(); toast(mode === 'on' ? 'PIN-код включён' : 'PIN-код изменён');
  });
}

/* ================= выбор нескольких операций (долгое нажатие) ================= */

const Sel = {
  on: false, ids: new Set(), lpTimer: null, lpXY: null, lpFired: false,
  refresh() {
    document.querySelectorAll('#s-ops .sw-c[data-tx]').forEach(el => el.closest('.sw').classList.toggle('picked', this.ids.has(el.dataset.tx)));
    document.body.classList.toggle('selmode', this.on);
    if (!this.on) return;
    const n = this.ids.size;
    document.getElementById('sel-count').textContent = 'Выбрано: ' + n + ' ' + plural(n, 'операция', 'операции', 'операций');
    document.getElementById('sel-hint').textContent = 'Нажимайте на операции, чтобы выбрать';
  },
  pick(id) { if (!this.on) { this.on = true; this.ids.clear(); } this.ids.add(id); this.refresh(); },
  toggle(id) { if (this.ids.has(id)) this.ids.delete(id); else this.ids.add(id); if (!this.ids.size) { this.exit(); return; } this.refresh(); },
  exit() { if (!this.on && !this.ids.size) return; this.on = false; this.ids.clear(); this.refresh(); },
  async del() {
    const n = this.ids.size;
    if (!n) return;
    const word = plural(n, 'операцию', 'операции', 'операций');
    if (!(await ask(`Удалить ${n} ${word}?`, 'Удалить', true, 'Сразу после удаления действие можно отменить.'))) return;
    const removed = S.txs.filter(t => this.ids.has(t.id));
    const before = derive().state.errors.length;
    S.txs = S.txs.filter(t => !this.ids.has(t.id));
    this.exit(); commit();
    const worse = derive().state.errors.length > before;
    toast(`Удалено: ${n} ${word}` + (worse ? '. Появились ошибки в операциях' : ''), 'Отменить', () => { S.txs.push(...removed); commit(); toast('Восстановлено'); });
  }
};
document.addEventListener('pointerdown', e => {
  const c = e.target.closest('#s-ops .sw-c[data-tx]');
  if (!c) return;
  Sel.lpFired = false; Sel.lpXY = [e.clientX, e.clientY];
  clearTimeout(Sel.lpTimer);

});
document.addEventListener('pointermove', e => { if (Sel.lpXY && Math.hypot(e.clientX - Sel.lpXY[0], e.clientY - Sel.lpXY[1]) > 10) clearTimeout(Sel.lpTimer); });
['pointerup', 'pointercancel'].forEach(t => document.addEventListener(t, () => { clearTimeout(Sel.lpTimer); Sel.lpXY = null; }));
document.addEventListener('scroll', () => clearTimeout(Sel.lpTimer), true);
document.addEventListener('contextmenu', e => { if (e.target.closest('#s-ops .sw-c')) e.preventDefault(); });

/* ================= калькулятор в полях сумм ================= */
// В поле суммы, цены, комиссии или налога можно набрать выражение: 1500×12+300.
// На телефонной цифровой клавиатуре нет знаков действий, поэтому под полем появляется строка кнопок.

function hasOps(v) { return /[+−×÷()*\/:]/.test(String(v).replace(/^\s*[−-]/, '')); }
function evalExpr(v) {
  const src = String(v).replace(/[\s ]/g, '').replace(/,/g, '.').replace(/\*/g, '×').replace(/[\/:]/g, '÷').replace(/[-–—]/g, '−').replace(/[xXхХ]/g, '×');
  if (!src) return NaN;
  const tk = src.match(/\d*\.?\d+|\d+\.|[+−×÷()]/g);
  if (!tk || tk.join('') !== src) return NaN;
  let i = 0;
  const num = () => { const t = tk[i]; if (t === undefined) throw 0; if (t === '(') { i++; const r = expr(); if (tk[i++] !== ')') throw 0; return r; } if (t === '−') { i++; return -num(); } if (t === '+') { i++; return num(); } if (/^[\d.]/.test(t)) { i++; return parseFloat(t); } throw 0; };
  const term = () => { let r = num(); while (tk[i] === '×' || tk[i] === '÷') { const op = tk[i++], b = num(); if (op === '÷') { if (b === 0) throw 0; r /= b; } else r *= b; } return r; };
  const expr = () => { let r = term(); while (tk[i] === '+' || tk[i] === '−') { const op = tk[i++], b = term(); r = op === '+' ? r + b : r - b; } return r; };
  try { const r = expr(); return i === tk.length && isFinite(r) ? Math.round(r * 1e8) / 1e8 : NaN; } catch (e) { return NaN; }
}
const plainNum = n => String(n).replace('.', ',');
const CALC_FIELDS = ['amount', 'price', 'fee', 'tax'];
const Calc = {
  bar: null, target: null,
  build() {
    const box = document.createElement('div');
    box.className = 'calcwrap';
    box.innerHTML = '<div class="calcbar" role="group" aria-label="Калькулятор">' +
      ['+', '−', '×', '÷', '(', ')', '=', '⌫'].map(o => `<button type="button" data-op="${o}" ${o === '=' ? 'class="eq"' : ''} aria-label="${{ '⌫': 'Стереть', '=': 'Вычислить', '−': 'Минус', '×': 'Умножить', '÷': 'Разделить' }[o] || o}">${o}</button>`).join('') +
      '</div><div class="calc-res num" aria-live="polite"></div>';
    box.addEventListener('pointerdown', e => { if (e.target.closest('button')) e.preventDefault(); });
    box.addEventListener('click', e => { const b = e.target.closest('[data-op]'); if (b) this.op(b.dataset.op); });
    return box;
  },
  attach(input) {
    if (!this.bar) this.bar = this.build();
    this.target = input;
    const host = input.closest('.grid2') || input.closest('.field');
    host.after(this.bar);
    this.bar.hidden = false;
    this.preview();
  },
  detach() { if (this.bar) this.bar.hidden = true; this.target = null; },
  set(v, caret) {
    const el = this.target;
    el.value = v;
    try { el.setSelectionRange(caret, caret); } catch (e) { /* поле без курсора */ }
    el.dispatchEvent(new Event('input', { bubbles: true }));
    this.preview();
  },
  op(o) {
    const el = this.target; if (!el) return;
    const v = el.value, a = el.selectionStart != null ? el.selectionStart : v.length, b = el.selectionEnd != null ? el.selectionEnd : v.length;
    if (o === '=') { this.resolve(true); return; }
    if (o === '⌫') { if (a !== b) this.set(v.slice(0, a) + v.slice(b), a); else if (a > 0) this.set(v.slice(0, a - 1) + v.slice(a), a - 1); return; }
    this.set(v.slice(0, a) + o + v.slice(b), a + 1);
  },
  preview() {
    const res = this.bar && this.bar.querySelector('.calc-res'), el = this.target;
    if (!res || !el) return;
    if (!hasOps(el.value)) { res.textContent = ''; res.classList.remove('err'); return; }
    const n = evalExpr(el.value);
    res.classList.toggle('err', !isFinite(n));
    res.textContent = isFinite(n) ? '= ' + new Intl.NumberFormat('ru-RU', { maximumFractionDigits: 8 }).format(n) : 'Выражение не закончено';
  },
  // заменить выражение результатом; false — выражение с ошибкой
  resolve(loud, input) {
    const el = input || this.target;
    if (!el || !hasOps(el.value)) return true;
    const n = evalExpr(el.value);
    if (!isFinite(n)) { if (loud) toast('Проверьте выражение'); return false; }
    el.value = plainNum(n);
    el.dispatchEvent(new Event('input', { bubbles: true }));
    if (el === this.target) this.preview();
    return true;
  }
};
document.addEventListener('focusin', e => {
  const t = e.target;
  if (t.form && t.form.id === 'tx-form' && CALC_FIELDS.includes(t.name)) Calc.attach(t);
  else if (Calc.target && !(Calc.bar && Calc.bar.contains(t))) Calc.detach();
});
document.addEventListener('focusout', e => {
  const t = e.target;
  if (t.form && t.form.id === 'tx-form' && CALC_FIELDS.includes(t.name)) {
    Calc.resolve(false, t);
    setTimeout(() => { const a = document.activeElement; if (!(a && a.form && a.form.id === 'tx-form' && CALC_FIELDS.includes(a.name))) Calc.detach(); }, 0);
  }
});
document.addEventListener('input', e => { if (e.target === Calc.target) Calc.preview(); });

/* ================= системная кнопка «Назад» и вкладки ================= */
// Как в «Расходах»: «Назад» закрывает шторку, снимает выбор, возвращает на прошлую вкладку,
// а на «Обзоре» после второго нажатия предлагает закрыть приложение.
// Chrome на Android пропускает записи истории без касания экрана, поэтому «запас» пополняется после касаний.
const Nav = { stack: [], backAt: 0, exiting: false, idx: 0 };
function go(tab, fromBack) {
  if (Sel.on) Sel.exit();
  if (!fromBack && tab !== UI.tab) {
    if (tab === 'overview') Nav.stack.length = 0;
    else { Nav.stack.push(UI.tab); if (Nav.stack.length > 30) Nav.stack.shift(); }
  }
  UI.tab = tab;
  try { sessionStorage.setItem('portfolio:tab', tab); } catch (e) { /* без sessionStorage */ }
  render(); window.scrollTo(0, 0);
}
const histIdx = () => { const st = history.state; return st && typeof st.pf === 'number' ? st.pf : 0; };
try { if (!history.state || typeof history.state.pf !== 'number') history.replaceState({ pf: 0 }, ''); } catch (e) { /* история недоступна */ }
Nav.idx = histIdx();
function armBack() {
  if (Nav.exiting) return;
  const need = Math.min(Nav.stack.length + 3, 20);
  try { while (Nav.idx < need) { Nav.idx++; history.pushState({ pf: Nav.idx }, ''); } } catch (e) { /* история недоступна */ }
}
armBack();
['pointerdown', 'pointerup', 'click', 'keydown', 'touchend'].forEach(t => document.addEventListener(t, () => { armBack(); setTimeout(armBack, 0); }, true));
window.addEventListener('popstate', () => {
  Nav.idx = histIdx();
  if (Nav.exiting) { history.back(); return; }
  if (document.getElementById('sheet').classList.contains('on')) { closeSheet(true); return; }
  if (Lock.on) { askExit(); return; }
  if (Sel.on) { Sel.exit(); return; }
  const open = document.querySelector('.sw.open');
  if (open) { closeSwipe(open); return; }
  if (Nav.stack.length) { go(Nav.stack.pop(), true); return; }
  if (UI.tab !== 'overview') { go('overview', true); return; }
  const now = Date.now();
  if (now - Nav.backAt < 2500) { Nav.backAt = 0; askExit(); return; }
  Nav.backAt = now;
  toast('Нажмите «Назад» ещё раз, чтобы закрыть приложение');
});
async function askExit() {
  if (!(await ask('Закрыть приложение?', 'Закрыть', false, '', Lock.on))) return;
  if (NATIVE) { try { await nativePlugin('App').exitApp(); return; } catch (e) { /* закрыть через историю */ } }
  Nav.exiting = true; Nav.idx = histIdx();
  if (Nav.idx > 0) history.go(-Nav.idx); else history.back();
}

/* ================= версия и обновление ================= */

async function appUpdate() {
  if (NATIVE) {
    // новая версия APK ставится поверх, данные сохраняются
    const a = document.createElement('a'); a.href = RELEASE_URL; a.target = '_blank'; a.rel = 'noopener';
    document.body.appendChild(a); a.click(); a.remove();
    toast('Скачайте новую версию и установите поверх — данные сохранятся');
    return;
  }
  if (!navigator.onLine) { toast('Для обновления нужен интернет'); return; }
  toast('Проверяю обновление…');
  try {
    const r = navigator.serviceWorker && await navigator.serviceWorker.getRegistration();
    if (r) await r.update();
    if (window.caches) { const ks = await caches.keys(); await Promise.all(ks.map(k => caches.delete(k))); }
  } catch (e) { /* обновится при следующем запуске */ }
  setTimeout(() => location.reload(), 400);
}

/* ================= оболочка ================= */

const TITLES = { overview: 'Обзор', positions: 'Позиции', ops: 'Операции', analytics: 'Аналитика', more: 'Ещё' };
const RENDER = { overview: renderOverview, positions: renderPositions, ops: renderOps, analytics: renderAnalytics, more: renderMore };

function render() {
  document.getElementById('title').textContent = TITLES[UI.tab];
  document.querySelectorAll('.screen').forEach(s => s.classList.toggle('on', s.id === 's-' + UI.tab));
  document.querySelectorAll('nav.tabs button').forEach(b => { const on = b.dataset.tab === UI.tab; b.classList.toggle('on', on); if (on) b.setAttribute('aria-current', 'page'); else b.removeAttribute('aria-current'); });
  const eye = document.getElementById('eye');
  eye.setAttribute('aria-pressed', S.settings.hideAmounts);
  eye.setAttribute('aria-label', S.settings.hideAmounts ? 'Показать суммы' : 'Скрыть суммы');
  eye.innerHTML = S.settings.hideAmounts
    ? '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 3l18 18M10.6 5.1A10 10 0 0 1 12 5c6 0 10 7 10 7a17 17 0 0 1-3 3.7M6.6 6.6C3.9 8.3 2 12 2 12s4 7 10 7a9.7 9.7 0 0 0 5.4-1.6"/><path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"/></svg>'
    : '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>';
  applyTheme();
  document.getElementById('refresh').hidden = S.demo || !S.txs.length;
  if (UI.tab !== 'ops' && Sel.on) Sel.exit();
  RENDER[UI.tab]();
  if (UI.tab === 'ops' && Sel.on) Sel.refresh();
}
function applyTheme() {
  const t = S.settings.theme;
  if (t === 'system') document.documentElement.removeAttribute('data-theme'); else document.documentElement.setAttribute('data-theme', t);
}
function commit() { invalidate(); render(); Store.save(S); }

let lastFocus = null;
function setInert() {
  const sheetOn = document.getElementById('sheet').classList.contains('on');
  const askTop = document.body.classList.contains('ask-top');
  ['header.top', 'main', 'nav.tabs', '#fab'].forEach(sel => { document.querySelector(sel).inert = sheetOn || Lock.on; });
  document.getElementById('sheet').inert = !sheetOn || (Lock.on && !askTop);
  document.getElementById('lock').inert = askTop;
}
function openSheet(html) {
  const sh = document.getElementById('sheet');
  if (!sh.classList.contains('on')) lastFocus = document.activeElement;
  sh.innerHTML = '<div class="grab" aria-hidden="true"></div>' + html;
  sh.scrollTop = 0;
  const title = sh.querySelector('#sheet-title');
  if (title) { sh.removeAttribute('aria-label'); sh.setAttribute('aria-labelledby', 'sheet-title'); }
  else { sh.removeAttribute('aria-labelledby'); sh.setAttribute('aria-label', 'Окно'); }
  sh.classList.add('on'); document.getElementById('sheet-bg').classList.add('on');
  setInert();
  const first = sh.querySelector('input:not([type=hidden]),select,button:not([data-act=close])');
  setTimeout(() => (first || sh).focus && (first || sh).focus({ preventScroll: true }), 50);
}
function closeSheet(fromBack) {
  if (!document.getElementById('sheet').classList.contains('on')) return;
  document.body.classList.remove('ask-top');
  if (askResolve) { const r = askResolve; askResolve = null; setTimeout(() => r(false)); }
  document.getElementById('sheet').classList.remove('on'); document.getElementById('sheet-bg').classList.remove('on');
  setInert();
  if (lastFocus && lastFocus.focus) lastFocus.focus({ preventScroll: true });
}

// подтверждение в шторке (как в «Расходах») вместо системного окна; true — согласие
let askResolve = null;
function ask(text, okLabel, danger, details, overLock) {
  return new Promise(res => {
    if (askResolve) { const r = askResolve; askResolve = null; r(false); }
    askResolve = res;
    document.body.classList.toggle('ask-top', !!overLock);
    openSheet(`<div class="sh"><h2 id="sheet-title" style="font:600 17px/1.3 var(--body)">${esc(text)}</h2></div>
      ${details ? `<p class="hint" style="margin:0 0 14px">${esc(details)}</p>` : ''}
      <div class="btn-row"><button class="btn" data-ask="0">Отмена</button><button class="btn ${danger ? 'danger' : 'primary'}" data-ask="1">${esc(okLabel || 'Да')}</button></div>`);
    if (overLock) { document.getElementById('sheet').inert = false; }
  });
}
function answerAsk(v) {
  const r = askResolve; askResolve = null;
  closeSheet();
  if (r) r(v);
}

let toastTimer = null;
function toast(msg, actionLabel, action) {
  const el = document.getElementById('toast');
  el.innerHTML = `<span>${esc(msg)}</span>` + (actionLabel ? `<button>${esc(actionLabel)}</button>` : '');
  if (action) el.querySelector('button').onclick = () => { el.classList.remove('on'); clearTimeout(toastTimer); action(); };
  el.classList.add('on');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('on'), actionLabel ? 5000 : 2200);
}

/* ================= события ================= */

document.addEventListener('click', e => {
  if (!S) return;
  const askBtn = e.target.closest('[data-ask]');
  if (askBtn) { answerAsk(askBtn.dataset.ask === '1'); return; }
  const tab = e.target.closest('nav.tabs [data-tab]');
  if (tab) { go(tab.dataset.tab); return; }
  const anp = e.target.closest('[data-anp]');
  if (anp) { UI.an.period = anp.dataset.anp; UI.an.limit = 4; render(); return; }
  const anm = e.target.closest('[data-anm]');
  if (anm) { UI.an.metric = anm.dataset.anm; render(); return; }
  const seg = e.target.closest('#donut path[data-k]');
  if (seg) { UI.allocSel = UI.allocSel === seg.dataset.k ? null : seg.dataset.k; renderOverview(); return; }
  // выбор нескольких операций: короткое нажатие отмечает, долгое — начинает выбор
  const swc = e.target.closest('#s-ops .sw-c[data-tx]');
  if (swc && (Sel.lpFired || Sel.on)) {
    e.preventDefault();
    if (Sel.lpFired) { Sel.lpFired = false; return; }
    Sel.toggle(swc.dataset.tx); return;
  }
  const per = e.target.closest('[data-period]');
  if (per) { UI.period = per.dataset.period; render(); return; }
  const al = e.target.closest('[data-alloc]');
  if (al) { UI.alloc = al.dataset.alloc; UI.allocSel = null; render(); return; }
  const pc = e.target.closest('[data-posclass]');
  if (pc) { UI.posClass = pc.dataset.posclass; render(); return; }
  const ot = e.target.closest('[data-opstype]');
  if (ot) { UI.opsType = ot.dataset.opstype; UI.opsLimit = 6; render(); return; }
  const asset = e.target.closest('[data-asset]:not([data-act])');
  if (asset) { openAsset(asset.dataset.asset, asset.dataset.account); return; }
  const openSw = document.querySelector('.sw.open');
  if (openSw && !e.target.closest('.sw-a')) { closeSwipe(openSw); return; }
  if (Swipe.justMoved) return;
  const txEl = !e.target.closest('.sw-a') && e.target.closest('[data-tx]');
  if (txEl) { openTx(txEl.dataset.tx); return; }
  const act = e.target.closest('[data-act]');
  if (!act) return;
  switch (act.dataset.act) {
    case 'close': closeSheet(); break;
    case 'an-more': UI.an.limit += 6; render(); break;
    case 'sel-cancel': Sel.exit(); break;
    case 'sel-del': Sel.del(); break;
    case 'app-update': appUpdate(); break;
    case 'add': openTxForm(null, act.dataset.preset ? { type: act.dataset.preset } : null); break;
    case 'demo':
      (async () => {
        if (S.txs.length && !S.demo && !(await ask('Заменить ваши данные демо-данными?', 'Заменить', true))) return;
        { const theme = S.settings.theme; S = makeDemo(); S.settings.theme = theme; } commit(); toast('Загружены демо-данные');
      })(); break;
    case 'clear-demo':
      (async () => {
        if (!(await ask('Удалить демо-данные и начать с пустого портфеля?', 'Удалить', true))) return;
        { const theme = S.settings.theme; S = initialState(); S.settings.theme = theme; } commit();
      })(); break;
    case 'wipe':
      (async () => {
        if (!(await ask('Удалить все счета, операции и цены?', 'Удалить', true, 'Это нельзя отменить. Перед удалением можно сохранить резервную копию.'))) return;
        { const theme = S.settings.theme; S = initialState(); S.settings.theme = theme; } commit(); toast('Данные удалены');
      })(); break;
    case 'del-tx': deleteTx(act.dataset.id); break;
    case 'edit-tx': openTxForm(S.txs.find(x => x.id === act.dataset.id)); break;
    case 'set-price': setPriceSheet(act.dataset.asset); break;
    case 'more-ops': UI.opsLimit = (UI.opsLimit || 6) + 6; render(); break;
    case 'add-acc': addAccountSheet(); break;
    case 'export-json': exportJson(); break;
    case 'export-csv': download('portfolio-operations-' + C.today() + '.csv', C.txsToCSV(S), 'text/csv;charset=utf-8'); break;
    case 'import-json': expectSystemUI(); document.getElementById('file-json').click(); break;
    case 'import-csv': expectSystemUI(); document.getElementById('file-csv').click(); break;
    case 'fee-go': feeGo(); break;
    case 'import-xlsx': expectSystemUI(); document.getElementById('file-xlsx').click(); break;
    case 'xlsx-go': xlsxCommit(); break;
    case 'restore': restoreBackup(act.dataset.mode); break;
    case 'apply-settings': applySettings(); break;
    case 'csv-go': csvCommit(); break;
    case 'refresh-quotes': Quotes.update({ force: true, manual: true }); break;
    case 'check-sources': Quotes.check(); break;
    case 'edit-asset': editAssetSheet(act.dataset.asset); break;
    case 'pin-on': case 'pin-change': case 'pin-off': pinSheet(act.dataset.act.slice(4)); break;
    case 'bio-toggle': toggleBio(); break;
    case 'lock-now': if (Lock.has()) { Lock.bioTried = true; Lock.show(); } break;
    case 'goto-quotes': UI.tab = 'more'; render(); setTimeout(() => { const c = document.getElementById('quotes-card'); if (c) c.scrollIntoView({ behavior: 'smooth', block: 'start' }); }, 50); break;
    case 'archive-acc': { const a = S.accounts.find(x => x.id === act.dataset.id); a.archived = !a.archived; commit(); break; }
  }
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && document.getElementById('sheet').classList.contains('on')) closeSheet();
  if ((e.key === 'Enter' || e.key === ' ') && e.target.matches('.tap, .kb')) { e.preventDefault(); e.target.click(); }
});
document.addEventListener('change', e => {
  const t = e.target;
  if (t.id === 'pos-account') { UI.posAccount = t.value; render(); }
  else if (t.id === 'pos-sort') { UI.posSort = t.value; render(); }
  else if (t.id === 'an-from' || t.id === 'an-to') {
    // берём обе даты из полей и сразу упорядочиваем, чтобы состояние совпадало с тем, что видно на экране
    let f = document.getElementById('an-from').value, to = document.getElementById('an-to').value;
    if (f && to && f > to) [f, to] = [to, f];
    UI.an.from = f; UI.an.to = to; render();
  }
  else if (t.id === 'an-acc') { UI.an.account = t.value; render(); }
  else if (t.id === 'set-base') { S.settings.baseCurrency = t.value; UI.contrib = null; commit(); }
  else if (t.id === 'set-theme') { S.settings.theme = t.value; commit(); }
  else if (t.id === 'set-method') { S.settings.method = t.value; commit(); }
  else if (t.id === 'set-lock') { S.settings.pin.lockAfterSec = +t.value; delete S.settings.pin.lockAfter; commit(); toast('Автоблокировка: ' + t.selectedOptions[0].textContent.toLowerCase()); }
  else if (t.id === 'set-auto') { S.settings.autoQuotes = t.checked; commit(); if (t.checked) Quotes.update(); }
  else if (t.id === 'set-interval') { S.settings.quoteRefreshMinutes = +t.value; commit(); }
  else if (t.id === 'set-proxy') { S.settings.proxyUrl = t.value.trim(); Quotes.checks = ''; commit(); Quotes.update({ force: true }); }
  else if (t.id === 'set-token') { S.settings.proxyToken = t.value.trim(); commit(); Quotes.update({ force: true }); }
  else if (t.id === 'set-td') { S.settings.twelveDataKey = t.value.trim(); commit(); Quotes.update({ force: true }); }
  else if (t.dataset.target) { S.targets[t.dataset.target] = Math.max(0, Math.min(100, parseNum(t.value) || 0)); commit(); }
  else if (t.id === 'contrib') { const v = C.parseMoney(t.value, S.settings.baseCurrency); UI.contrib = v > 0 ? v : 0; render(); }
});
let qTimer = null;
document.addEventListener('input', e => {
  if (e.target.id === 'ops-q') {
    UI.opsQuery = e.target.value;
    clearTimeout(qTimer);
    qTimer = setTimeout(() => { const pos = e.target.selectionStart; render(); const q = document.getElementById('ops-q'); q.focus(); q.setSelectionRange(pos, pos); }, 200);
  }
});
document.getElementById('sheet-bg').addEventListener('click', closeSheet);
document.getElementById('fab').addEventListener('click', () => openTxForm());
function setHidden(v) { S.settings.hideAmounts = v; render(); Store.save(S); toast(v ? 'Суммы скрыты' : 'Суммы показаны'); }
async function revealAmounts() {
  if (!Lock.has()) { setHidden(false); return; }
  if (Bio.enabled()) { try { await Bio.verify('Показать суммы'); setHidden(false); return; } catch (e) { /* дальше — PIN-код */ } }
  openSheet(`<div class="sh"><h2 id="sheet-title">Показать суммы</h2><button class="iconbtn" data-act="close" aria-label="Закрыть">✕</button></div>
    <label class="field"><span>Введите PIN-код</span><input class="input num" type="password" id="rv-pin" inputmode="numeric" maxlength="6" autocomplete="off"></label>
    <p class="err" id="rv-err" role="alert"></p><button class="btn primary block" id="rv-ok">Показать</button>`);
  const inp = document.getElementById('rv-pin');
  const check = async () => {
    if (await C.checkPin(inp.value, S.settings.pin)) { closeSheet(); setHidden(false); }
    else { inp.value = ''; document.getElementById('rv-err').textContent = 'Неверный PIN-код'; }
  };
  document.getElementById('rv-ok').onclick = check;
  inp.addEventListener('input', () => { if (inp.value.length === (S.settings.pin.len || 4)) check(); });
}
document.getElementById('eye').addEventListener('click', () => { if (S.settings.hideAmounts) revealAmounts(); else setHidden(true); });
if (window.matchMedia) matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => render());

if (!NATIVE && 'serviceWorker' in navigator && location.protocol !== 'file:') {
  let hadCtrl = !!navigator.serviceWorker.controller, reloaded = false;
  navigator.serviceWorker.addEventListener('controllerchange', () => {
    if (!hadCtrl) { hadCtrl = true; return; }
    if (reloaded) return;
    reloaded = true;
    const busy = document.getElementById('sheet').classList.contains('on') || Sel.on || Lock.on;
    if (busy) toast('Загружена новая версия, она откроется при следующем запуске'); else location.reload();
  });
  navigator.serviceWorker.register('sw.js', { updateViaCache: 'none' }).then(r => {
    r.update().catch(() => {});
    document.addEventListener('visibilitychange', () => { if (!document.hidden) r.update().catch(() => {}); });
  }).catch(() => {});
}

(async () => {
  await Store.init();
  try {
    const saved = await Store.load();
    S = saved || initialState();
  } catch (e) {
    S = initialState();
    toast('Не удалось прочитать сохранённые данные');
  }
  try { const t = sessionStorage.getItem('portfolio:tab'); if (t && RENDER[t]) UI.tab = t; } catch (e) { /* без sessionStorage */ }
  const boot = () => { render(); Quotes.start(); };
  if (Lock.has()) { applyTheme(); Lock.show(boot); } else boot();
})();
</script>
</body>
</html>
